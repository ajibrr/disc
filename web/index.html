<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tick Charts — NIFTY / SENSEX (12s–300s)</title>
<script src="lib/lightweight-charts.standalone.production.js"></script>
<script src="generated/data.js"></script>
<script src="generated/config.js"></script>
<script src="../src/confirmation.js"></script>
<script src="generated/ltf-config.js"></script>
<script src="../src/ltf-conditions.js"></script>
<script src="generated/strategies-config.js"></script>
<script src="../src/trade-sim.js"></script>
<script src="../src/strategies.js"></script>
<script src="../src/oi-flow.js"></script>
<script src="../src/trendlines.js"></script>
<style>
  :root {
    --bg: #0d1117;
    --panel: #131722;
    --panel-2: #1c2030;
    --border: #2a2e39;
    --text: #d1d4dc;
    --muted: #8a8f98;
    --up: #26a69a;
    --down: #ef5350;
    --accent: #2962ff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ---------- toolbar ---------- */
  .toolbar {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 8px 14px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .brand { display: flex; align-items: baseline; gap: 8px; margin-right: 6px; }
  .brand b { font-size: 14px; letter-spacing: .2px; }
  .brand span { color: var(--muted); font-size: 11px; }
  .ctrl { display: flex; align-items: center; gap: 7px; }
  .ctrl > label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .6px; }
  select {
    appearance: none;
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 5px 26px 5px 9px;
    font-size: 13px;
    cursor: pointer;
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 14px) 50%, calc(100% - 9px) 50%;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
  }
  select:hover { border-color: #3d4450; }
  select:focus { outline: none; border-color: var(--accent); }
  .lock {
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(41, 98, 255, .12);
    border: 1px solid rgba(41, 98, 255, .4);
    color: #6d9bff;
    border-radius: 4px;
    padding: 4px 9px;
    font-size: 11.5px;
    font-weight: 600;
    white-space: nowrap;
  }
  .meta { margin-left: auto; color: var(--muted); font-size: 11.5px; display: flex; gap: 14px; flex-wrap: wrap; }
  .meta b { color: var(--text); font-weight: 600; }
  .dot { color: var(--border); }

  /* ---------- dual layout ---------- */
  main {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    padding: 10px;
  }
  @media (max-width: 980px) {
    main { grid-template-columns: 1fr; grid-auto-rows: minmax(320px, 1fr); overflow-y: auto; }
    body { overflow: auto; }
  }
  .panel {
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
  }
  .panel-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 10px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, #171b26, #131722);
  }
  .tag {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .8px;
    padding: 2px 7px;
    border-radius: 3px;
    color: #fff;
  }
  .tag.htf { background: #2962ff33; color: #6d9bff; border: 1px solid #2962ff55; }
  .tag.ltf { background: #00bcd433; color: #4dd0e1; border: 1px solid #00bcd455; }
  .panel-head .symbol { font-weight: 700; font-size: 13.5px; }
  .panel-head .tf-label { color: var(--muted); font-size: 11px; }
  .panel-head .count { color: var(--muted); font-size: 11px; margin-left: auto; }
  .icon-btn {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 4px;
    width: 26px;
    height: 24px;
    cursor: pointer;
    font-size: 13px;
    line-height: 1;
  }
  .icon-btn:hover { color: var(--text); border-color: #3d4450; }

  .legend {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 5px 10px;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 11.5px;
    color: var(--muted);
    border-bottom: 1px solid rgba(42, 46, 57, .6);
    white-space: nowrap;
    overflow: hidden;
  }
  .legend .t { color: var(--text); }
  .legend .k { opacity: .7; margin-right: 3px; }
  .legend .v { color: var(--text); font-variant-numeric: tabular-nums; }
  .legend .up { color: var(--up); }
  .legend .down { color: var(--down); }
  .chart { flex: 1; min-height: 0; position: relative; }
  .rsi-legend {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 3px 10px;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 11px;
    color: var(--muted);
    border-top: 1px solid var(--border);
    white-space: nowrap;
    overflow: hidden;
  }
  .rsi-legend b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
  .rsi-legend .t { color: var(--text); }
  .rsi-legend .rsi-v { color: #6d9bff; }
  .rsi-legend .ma-v { color: #ffb020; }
  .rsi-chart { height: 130px; flex: none; border-top: 1px solid rgba(42, 46, 57, .6); }
  .spread-chart { height: 100px; flex: none; border-top: 1px solid rgba(42, 46, 57, .6); }
  .oi-legend .ce-v { color: #ef5350; }
  .oi-legend .pe-v { color: #26a69a; }
  .spread-legend .pos { color: var(--up); }
  .spread-legend .neg { color: var(--down); }

  /* ---------- HTF confirmation ---------- */
  .conf-legend {
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 3px 10px;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 11px;
    color: var(--muted);
    border-bottom: 1px solid rgba(42, 46, 57, .6);
    white-space: nowrap;
    overflow: hidden;
  }
  .conf-legend .t { color: var(--text); }
  .conf-legend .grp { letter-spacing: .3px; opacity: .75; }
  .conf-legend .ok { color: var(--up); font-weight: 700; }
  .conf-legend .bad { color: var(--down); font-weight: 700; }
  .conf-legend .st { font-weight: 700; }
  .conf-legend .st.a { color: #6d9bff; }
  .conf-legend .st.b { color: #ffb020; }
  .conf-legend .st.no { color: var(--muted); }
  .conf-legend .st.na { color: #6b7280; }
  .conf-legend .hint { opacity: .7; }

  .conf-badge {
    display: none;
    align-items: center;
    gap: 6px;
    padding: 4px 9px;
    border-radius: 4px;
    font-size: 11.5px;
    font-weight: 600;
    white-space: nowrap;
    border: 1px solid var(--border);
    color: var(--muted);
    background: var(--panel-2);
  }
  .conf-badge.on { display: flex; }
  .tool-btn {
    background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    border-radius: 4px; height: 24px; padding: 0 9px; cursor: pointer; font-size: 12px;
  }
  .tool-btn:hover { border-color: #3d4450; }
  .tool-btn.on { background: #2962ff33; border-color: #2962ff; color: #6d9bff; }
  #tl-color { width: 26px; height: 24px; padding: 0; border: 1px solid var(--border); border-radius: 4px; background: none; cursor: pointer; }
  .strat-badge.pos { color: #26a69a; border-color: #26a69a66; background: rgba(38, 166, 154, .12); }
  .strat-badge.neg { color: #ef5350; border-color: #ef535066; background: rgba(239, 83, 80, .12); }
  .conf-badge.a { color: #6d9bff; border-color: #2962ff55; background: rgba(41, 98, 255, .12); }
  .conf-badge.b { color: #ffb020; border-color: #ff980055; background: rgba(255, 152, 0, .12); }

  .switch { display: flex; align-items: center; gap: 7px; cursor: pointer; user-select: none; font-size: 12px; color: var(--text); }
  .switch input { accent-color: var(--accent); cursor: pointer; margin: 0; }

  /* -2 outline: absolutely positioned above the chart canvases (z-index 1/2) */
  .conf-outline {
    position: absolute;
    display: none;
    border: 1px solid #2962ff;
    border-radius: 2px;
    pointer-events: none;
    z-index: 5;
    box-shadow: 0 0 0 1px rgba(41, 98, 255, .2);
  }
</style>
</head>
<body>

<header class="toolbar">
  <div class="brand"><b>TickCharts</b><span>NSE / BSE second data</span></div>

  <div class="ctrl">
    <label for="instrument">Instrument</label>
    <select id="instrument"></select>
  </div>

  <div class="ctrl">
    <label for="date">Date</label>
    <select id="date"></select>
  </div>

  <div class="ctrl" title="Which strategy's trades are drawn and counted. Switched on / off in config/strategies.json">
    <label for="strategy-select">Strategy</label>
    <select id="strategy-select"></select>
  </div>

  <div class="lock" id="lock" title="LTF (signal) and HTF (confirmation) are locked at a 5:1 ratio">
    <span>🔒</span><span id="lock-text">5:1 locked</span>
  </div>

  <div class="ctrl">
    <label class="switch" title="Highlight HTF candle-pattern matches on both charts">
      <input type="checkbox" id="confirm-toggle" checked />
      HTF Confirmation
    </label>
  </div>

  <div class="ctrl">
    <label class="switch" title="LTF conditions drawn on the signal chart (Condition 1: RSI 50 cross after a highlighted band). Needs HTF Confirmation on.">
      <input type="checkbox" id="ltf-toggle" checked />
      LTF Conditions
    </label>
  </div>

  <div class="ctrl" id="tl-ctrl" title="Trend lines: click Draw, then click two points on a price chart. Drag a line or its ends to adjust, Delete removes the selected line, Esc cancels.">
    <button class="tool-btn" id="tl-draw" type="button">&#9998; Trend line</button>
    <button class="tool-btn" id="tl-parallel" type="button" disabled title="Select a line, click here, then click where the parallel line should pass (Esc cancels)">&#8741; Parallel</button>
    <input type="color" id="tl-color" value="#ffeb3b" title="Colour of new / selected lines" />
    <label class="switch" title="Extend new / selected lines to the right edge">
      <input type="checkbox" id="tl-extend" />
      Extend &rarr;
    </label>
    <button class="tool-btn" id="tl-delete" type="button" title="Delete the selected line (Delete key)">Delete</button>
    <button class="tool-btn" id="tl-clear" type="button" title="Remove every trend line of this instrument / date on both charts">Clear</button>
  </div>

  <div class="conf-badge" id="conf-badge" title="State of the latest completed HTF candle"></div>
  <div class="conf-badge strat-badge" id="strategy-badge" title="Strategy back-test of the session on screen"></div>

  <div class="meta" id="meta"></div>
</header>

<main>
  <section class="panel" data-panel="htf">
    <div class="panel-head">
      <span class="tag htf" title="Confirmation timeframe — always 5× the LTF">HTF</span>
      <span class="symbol" data-role="symbol">—</span>
      <span class="tf-label">Timeframe</span>
      <select data-role="tf"></select>
      <span class="count" data-role="count"></span>
      <button class="icon-btn" data-role="fit" title="Fit content">⤢</button>
    </div>
    <div class="legend" data-role="legend"></div>
    <div class="conf-legend" data-role="conf-legend"></div>
    <div class="rsi-legend oi-legend" data-role="oi-legend"></div>
    <div class="chart" data-role="chart"></div>
    <div class="rsi-legend" data-role="rsi-legend"></div>
    <div class="rsi-chart" data-role="rsi-chart"></div>
  </section>

  <section class="panel" data-panel="ltf">
    <div class="panel-head">
      <span class="tag ltf" title="Signal timeframe — always 1/5 of the HTF">LTF</span>
      <span class="symbol" data-role="symbol">—</span>
      <span class="tf-label">Timeframe</span>
      <select data-role="tf"></select>
      <span class="count" data-role="count"></span>
      <button class="icon-btn" data-role="fit" title="Fit content">⤢</button>
    </div>
    <div class="legend" data-role="legend"></div>
    <div class="conf-legend" data-role="conf-legend"></div>
    <div class="chart" data-role="chart"></div>
    <div class="rsi-legend" data-role="rsi-legend"></div>
    <div class="rsi-chart" data-role="rsi-chart"></div>
    <div class="rsi-legend spread-legend" data-role="spread-legend"></div>
    <div class="spread-chart" data-role="spread-chart"></div>
  </section>
</main>

<script>
'use strict';

/* ---------------- config ---------------- */

/* Locked 5:1 pairing: LTF (signal) -> HTF (confirmation). Only the two timeframes the strategy is run on are offered:
   12s->60s (1m), 36s->180s (3m). (The slower pairs 1m/5m, 3m/15m, 5m/25m produced almost no signals — docs/optimization.md.) */
const TF_LABELS = {
  12: '12s', 36: '36s', 60: '1m', 180: '3m',
};
const LTF_OPTIONS = [12, 36];                    // signal timeframes
const HTF_OF = { 12: 60, 36: 180 };
const HTF_OPTIONS = [60, 180];                   // confirmation timeframes
const LTF_OF = Object.fromEntries(Object.entries(HTF_OF).map(([l, h]) => [h, Number(l)]));
const DEFAULTS = { ltf: 12, htf: 60 };           // 12s signal / 1m confirmation
const TZ = 'Asia/Kolkata';
const DATA = window.CHART_DATA || { instruments: {} };
const TC = window.TickConfirm;   // pure rule module (src/confirmation.js)

/* HTF filters — from config/htf.json via `node scripts/build-config.js`; run that AND
   reload this page after every config edit (the page reads config.js once at load).
   Two independent sections, each three-mode: off (original behavior) / active (gate
   applies) / error (fail closed: never matches, problem displayed — htf_sma.md §3.4
   and Part II P6). SLOPE_FILTER carries the rsi normalizer on `.rsi` so both
   sections travel through one cache key without changing the getStates wiring. */
const SLOPE_FILTER = TC.normalizeFilter(window.HTF_CONFIG);
SLOPE_FILTER.rsi = TC.normalizeSmaRsiFilter(window.HTF_CONFIG);
SLOPE_FILTER.oi = TC.normalizeOiFilter(window.HTF_CONFIG);        // option-chain OI-change gate (per-candle values attached in getStates)
const CONFIG_PROBLEMS = (() => {
  const sec = (cfg, name) => (cfg.problems || []).map((p) =>
    (p.startsWith('sma_') || p.startsWith('oi_') || p.startsWith('config')) ? p : name + ': ' + p);
  const all = sec(SLOPE_FILTER, 'sma_slope_filter').concat(sec(SLOPE_FILTER.rsi, 'sma_rsi_filter'), sec(SLOPE_FILTER.oi, 'oi_change_filter'));
  return all.filter((p, i) => all.indexOf(p) === i);   // dedupe (e.g. missing config.js twice)
})();
const CONFIG_ERROR = SLOPE_FILTER.mode === 'error' || SLOPE_FILTER.rsi.mode === 'error' || SLOPE_FILTER.oi.mode === 'error';
if (CONFIG_ERROR) console.warn('[config] ' + CONFIG_PROBLEMS.join('; '));

/* LTF conditions — from config/ltf.json via `node scripts/build-config.js` (same rule: run it
   and reload after every edit). Condition 1 = RSI 50 cross after a highlighted band
   (ltf.md). Three-mode like the HTF filters: off / active / error (fail closed: no
   arrows, problem displayed). */
const TL = window.TickLtf;      // pure rule module (src/ltf-conditions.js)
const LTF_COND1 = TL.normalizeCondition1(window.LTF_CONFIG);
if (LTF_COND1.mode === 'error') console.warn('[ltf config] ' + LTF_COND1.problems.join('; '));
const LTF_COND2 = TL.normalizeCondition2(window.LTF_CONFIG);   // SMA trend filter on C1 (ltf.md)
if (LTF_COND2.mode === 'error') console.warn('[ltf config] ' + LTF_COND2.problems.join('; '));
const LTF_COND3 = TL.normalizeCondition3(window.LTF_CONFIG);   // SMA spread band on C1 + C2 (ltf.md)
if (LTF_COND3.mode === 'error') console.warn('[ltf config] ' + LTF_COND3.problems.join('; '));
const LTF_COND4 = TL.normalizeCondition4(window.LTF_CONFIG);   // SMA-of-RSI extreme before C1+C2+C3 (ltf.md)
if (LTF_COND4.mode === 'error') console.warn('[ltf config] ' + LTF_COND4.problems.join('; '));
const TL_ = window.TickLines;    // trend-line helpers (src/trendlines.js)
const TF_ = window.TickFlow;     // option-chain flow helpers (src/oi-flow.js)
const TT = window.TickTrade;     // strategy simulation (src/trade-sim.js, docs/strategy.md)
const TS = window.TickStrategies;   // strategy registry (src/strategies.js, config/strategies.json)
const REGISTRY = TS.normalizeRegistry(window.STRATEGIES_CONFIG);
if (REGISTRY.mode === 'error') console.warn('[strategies config] ' + REGISTRY.problems.join('; '));
const LTF_COND6 = TL.normalizeCondition6(window.LTF_CONFIG);   // risk range (E candle distance between a minimum and a maximum) on C1..C5
if (LTF_COND6.mode === 'error') console.warn('[ltf config] ' + LTF_COND6.problems.join('; '));
const LTF_COND5 = TL.normalizeCondition5(window.LTF_CONFIG);   // back vs E candle distance, Patterns A and B (ltf_condition5_distance_ratio.md)
if (LTF_COND5.mode === 'error') console.warn('[ltf config] ' + LTF_COND5.problems.join('; '));

/* ---------------- time formatting (always IST) ---------------- */

const fmtTime = new Intl.DateTimeFormat('en-GB', {
  timeZone: TZ, hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false,
});
const fmtHM = new Intl.DateTimeFormat('en-GB', {
  timeZone: TZ, hour: '2-digit', minute: '2-digit', hour12: false,
});
const fmtDay = new Intl.DateTimeFormat('en-GB', { timeZone: TZ, day: '2-digit', month: 'short' });
const fmtMonth = new Intl.DateTimeFormat('en-GB', { timeZone: TZ, month: 'short' });
const fmtYear = new Intl.DateTimeFormat('en-GB', { timeZone: TZ, year: 'numeric' });

// TimeScale tick-mark types from lightweight-charts v4
const TickMarkType = { Year: 0, Month: 1, DayOfMonth: 2, Time: 3, TimeWithSeconds: 4 };

function tickMarkLabel(time, type) {
  const d = new Date(time * 1000);
  switch (type) {
    case TickMarkType.Year: return fmtYear.format(d);
    case TickMarkType.Month: return fmtMonth.format(d);
    case TickMarkType.DayOfMonth: return fmtDay.format(d);
    case TickMarkType.TimeWithSeconds: return fmtTime.format(d);
    default: return fmtHM.format(d);
  }
}

/* ---------------- tick data ---------------- */

const tickCache = new Map();

/** Flatten the stored segments of one instrument/date into parallel arrays. */
function getTicks(symbol, date) {
  const key = symbol + '|' + date;
  if (tickCache.has(key)) return tickCache.get(key);

  const day = DATA.instruments[symbol] && DATA.instruments[symbol].dates[date];
  if (!day) return null;

  let n = 0;
  for (const seg of day.segments) n += seg.prices.length;

  const times = new Float64Array(n);
  const prices = new Float64Array(n);
  let i = 0;
  for (const seg of day.segments) {
    for (let k = 0; k < seg.prices.length; k++) {
      times[i] = seg.start + k;
      prices[i] = seg.prices[k];
      i++;
    }
  }
  const out = { times, prices, meta: day };
  tickCache.set(key, out);
  return out;
}

/** Aggregate 1s ticks into OHLC candles of `tf` seconds, forward-filling gaps. */
function buildCandles(ticks, tf) {
  const { times, prices } = ticks;
  const start = times[0];
  const out = [];
  let cur = null;

  for (let i = 0; i < times.length; i++) {
    const t = times[i];
    const p = prices[i];
    const bucket = start + Math.floor((t - start) / tf) * tf;

    if (cur === null || bucket !== cur.time) {
      // carry the last close through any fully-missed buckets (feed gaps)
      if (cur) {
        for (let f = cur.time + tf; f < bucket; f += tf) {
          out.push({ time: f, open: cur.close, high: cur.close, low: cur.close, close: cur.close });
        }
      }
      cur = { time: bucket, open: p, high: p, low: p, close: p };
      out.push(cur);
    } else {
      if (p > cur.high) cur.high = p;
      if (p < cur.low) cur.low = p;
    }
    cur.close = p;
  }
  return out;
}

/* ---------------- indicators ---------------- */

/** Simple moving average; null until `period` values are available. */
function smaNullable(values, period) {
  const out = new Array(values.length).fill(null);
  for (let i = period - 1; i < values.length; i++) {
    let sum = 0;
    let ok = true;
    for (let k = i - period + 1; k <= i; k++) {
      if (values[k] == null) { ok = false; break; }
      sum += values[k];
    }
    if (ok) out[i] = sum / period;
  }
  return out;
}

/** Wilder RSI 14 (same smoothing TradingView uses). */
function rsi(closes, period = 14) {
  const out = new Array(closes.length).fill(null);
  if (closes.length <= period) return out;

  let gain = 0, loss = 0;
  for (let i = 1; i <= period; i++) {
    const d = closes[i] - closes[i - 1];
    if (d > 0) gain += d; else loss -= d;
  }
  let ag = gain / period;
  let al = loss / period;
  const toRsi = () => (al === 0 ? 100 : 100 - 100 / (1 + ag / al));
  out[period] = toRsi();

  for (let i = period + 1; i < closes.length; i++) {
    const d = closes[i] - closes[i - 1];
    ag = (ag * (period - 1) + (d > 0 ? d : 0)) / period;
    al = (al * (period - 1) + (d < 0 ? -d : 0)) / period;
    out[i] = toRsi();
  }
  return out;
}

/* ---------------- chart panel ---------------- */

const CHART_OPTS = {
  layout: {
    background: { type: 'solid', color: '#131722' },
    textColor: '#d1d4dc',
    fontSize: 11,
  },
  grid: {
    vertLines: { color: 'rgba(42, 46, 57, 0.6)' },
    horzLines: { color: 'rgba(42, 46, 57, 0.6)' },
  },
  crosshair: {
    // Magnet: the line snaps to the candle under the pointer (and to the series value
    // on the price axis). Normal mode let the line rest between candles while
    // param.time — legend, readout and the mirrored crosshair — named a neighbouring
    // bar, so the line and its labels visibly disagreed; with the sub-charts'
    // geometry pixel-aligned, Magnet makes both charts’ lines land on the same x too.
    mode: 1, // CrosshairMode.Magnet
    vertLine: {
      color: '#758696', width: 1, style: 2, // dashed
      labelBackgroundColor: '#363a45',
    },
    horzLine: {
      color: '#758696', width: 1, style: 2,
      labelBackgroundColor: '#363a45',
    },
  },
  // minimumWidth: floor both sub-charts' price scales to the same width from birth.
  // The scales otherwise size to their labels ("22600.00" ≈ 66px vs "100.0" ≈ 48px),
  // which makes the plot widths differ and the same timestamp land at different x
  // pixels on the price and RSI charts — visibly misaligning the mirrored crosshair
  // and the time-axis labels. 66 = measured width of the widest NIFTY/SENSEX label at
  // the 11px UI font; Panel.syncScaleWidths() still reconciles at runtime if a
  // future instrument ever needs a wider label.
  rightPriceScale: { borderColor: '#2a2e39', scaleMargins: { top: 0.12, bottom: 0.12 }, minimumWidth: 66 },
  timeScale: {
    borderColor: '#2a2e39',
    timeVisible: true,
    secondsVisible: true,
    rightOffset: 2,
    tickMarkFormatter: (time, type) => tickMarkLabel(time, type),
  },
  localization: {
    locale: 'en-GB',
    timeFormatter: (time) => fmtTime.format(new Date(time * 1000)),
  },
};

function fmtPrice(v, decimals) {
  return v == null ? '—' : Number(v).toFixed(decimals);
}

class Panel {
  constructor(root, key) {
    this.key = key;
    this.el = root;
    this.symbolEl = root.querySelector('[data-role="symbol"]');
    this.tfEl = root.querySelector('[data-role="tf"]');
    this.countEl = root.querySelector('[data-role="count"]');
    this.legendEl = root.querySelector('[data-role="legend"]');
    this.chartEl = root.querySelector('[data-role="chart"]');
    this.rsiLegendEl = root.querySelector('[data-role="rsi-legend"]');
    this.rsiChartEl = root.querySelector('[data-role="rsi-chart"]');
    this.spreadChartEl = root.querySelector('[data-role="spread-chart"]');     // LTF only
    this.spreadLegendEl = root.querySelector('[data-role="spread-legend"]');
    this.oiLegendEl = root.querySelector('[data-role="oi-legend"]');           // HTF only: CE / PE OI change readout (src/oi-flow.js)

    for (const sec of (key === 'htf' ? HTF_OPTIONS : LTF_OPTIONS)) {
      const o = document.createElement('option');
      o.value = String(sec);
      o.textContent = TF_LABELS[sec];
      this.tfEl.appendChild(o);
    }
    this.tfEl.value = String(DEFAULTS[key]);
    this.tfEl.addEventListener('change', () => {
      this.tfSec = Number(this.tfEl.value);
      this.render(true);
    });
    root.querySelector('[data-role="fit"]').addEventListener('click', () => {
      this.chart.timeScale().fitContent();
      this.rsiChart.timeScale().fitContent();
      if (this.spreadChart) this.spreadChart.timeScale().fitContent();
    });

    // HTF: the CE / PE OI-change lines live in this same chart, in a band under the candles on a LEFT price scale.
    // The candles keep the upper part of the right scale; the RSI chart below gets an identical (empty) left scale so
    // both time axes stay pixel-aligned.
    const OI_BAND_TOP = 0.72;
    this.chart = LightweightCharts.createChart(this.chartEl, key === 'htf' ? {
      ...CHART_OPTS,
      leftPriceScale: { visible: true, borderColor: '#2a2e39', scaleMargins: { top: OI_BAND_TOP, bottom: 0.03 }, minimumWidth: 66 },
      rightPriceScale: { borderColor: '#2a2e39', scaleMargins: { top: 0.10, bottom: 1 - OI_BAND_TOP + 0.04 }, minimumWidth: 66 },
    } : CHART_OPTS);
    this.series = this.chart.addCandlestickSeries({
      upColor: '#26a69a', downColor: '#ef5350',
      borderUpColor: '#26a69a', borderDownColor: '#ef5350',
      wickUpColor: '#26a69a', wickDownColor: '#ef5350',
      priceFormat: { type: 'price', precision: 2, minMove: 0.01 },
    });

    // SMA 9 overlay, drawn on the same (right) price scale as the candles
    this.smaSeries = this.chart.addLineSeries({
      color: '#d1d4dc', lineWidth: 2, title: 'SMA 9',
      priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false,
    });

    // SMA 44 — LTF panel only, green
    this.sma44Series = key === 'ltf'
      ? this.chart.addLineSeries({
          color: '#00e676', lineWidth: 2, title: 'SMA 44',
          priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false,
        })
      : null;

    // RSI sub-panel: its own chart instance, time-synced to the price chart
    this.rsiChart = LightweightCharts.createChart(this.rsiChartEl, {
      ...CHART_OPTS,
      ...(key === 'htf' ? { leftPriceScale: { visible: true, borderColor: '#2a2e39', minimumWidth: 66 } } : {}),
      rightPriceScale: { borderColor: '#2a2e39', scaleMargins: { top: 0.2, bottom: 0.2 }, minimumWidth: 66 },
    });
    const rsiFmt = { type: 'custom', formatter: (v) => v.toFixed(1), minMove: 0.1 };
    const pinScale = () => ({ priceRange: { minValue: 0, maxValue: 100 } });
    this.rsiSeries = this.rsiChart.addLineSeries({
      color: '#2962ff', lineWidth: 2, title: 'RSI 14',
      priceLineVisible: false, priceFormat: rsiFmt, autoscaleInfoProvider: pinScale,
    });
    this.rsiMaSeries = this.rsiChart.addLineSeries({
      color: '#ffb020', lineWidth: 1, title: 'SMA 14 (RSI)',
      priceLineVisible: false, priceFormat: rsiFmt, autoscaleInfoProvider: pinScale,
    });
    for (const lvl of [70, 30]) {
      this.rsiSeries.createPriceLine({
        price: lvl,
        color: lvl === 70 ? 'rgba(239, 83, 80, .6)' : 'rgba(38, 166, 154, .6)',
        lineWidth: 1, lineStyle: 2, axisLabelVisible: true, title: String(lvl),
      });
    }

    // LTF only: SMA 9 / SMA 44 spread histogram (view-only indicator, ltf.md)
    if (this.spreadChartEl) {
      this.spreadChart = LightweightCharts.createChart(this.spreadChartEl, {
        ...CHART_OPTS,
        rightPriceScale: { borderColor: '#2a2e39', scaleMargins: { top: 0.15, bottom: 0.15 }, minimumWidth: 66 },
        timeScale: { ...CHART_OPTS.timeScale, visible: false },
      });
      this.spreadSeries = this.spreadChart.addHistogramSeries({
        title: 'SMA 9/44 %', priceLineVisible: false,
        priceFormat: { type: 'custom', formatter: (v) => v.toFixed(3) + '%', minMove: 0.001 },
      });
      this.spreadSeries.createPriceLine({
        price: 0, color: 'rgba(117, 134, 150, .7)', lineWidth: 1, lineStyle: 2,
        axisLabelVisible: false, title: '',
      });
    }
    this.spreadAt = new Map();    // candleTime -> { pct, fast, slow }

    // HTF only: option-chain flow — CE and PE open-interest CHANGE per candle, drawn INSIDE the price chart as two lines
    // on the left price scale (src/oi-flow.js)
    if (key === 'htf') {
      const oiFmt = { type: 'custom', formatter: (v) => TF_.fmtCompact(v), minMove: 1 };
      this.ceSeries = this.chart.addLineSeries({
        priceScaleId: 'left', color: '#ef5350', lineWidth: 2, title: 'CE OI chg', priceLineVisible: false,
        lastValueVisible: true, crosshairMarkerVisible: false, priceFormat: oiFmt,
      });
      this.peSeries = this.chart.addLineSeries({
        priceScaleId: 'left', color: '#26a69a', lineWidth: 2, title: 'PE OI chg', priceLineVisible: false,
        lastValueVisible: true, crosshairMarkerVisible: false, priceFormat: oiFmt,
      });
      this.ceSeries.createPriceLine({
        price: 0, color: 'rgba(117, 134, 150, .7)', lineWidth: 1, lineStyle: 2, axisLabelVisible: false, title: '',
      });
    }
    this.oiAt = new Map();        // candleTime -> { dce, dpe, minutes, lastSnapshot }

    /* ---------- HTF pattern confirmation visuals ---------- */
    this.confirmLegendEl = root.querySelector('[data-role="conf-legend"]');
    this.states = new Map();      // HTF: closeTime -> state
    this.ltfBands = new Map();    // LTF: candleTime -> state
    this.cond1 = new Map();       // LTF Condition 1: band closeTime -> [marks]
    this.cond2 = new Map();       // LTF Condition 2: band closeTime -> [marks]
    this.cond3 = new Map();       // LTF Condition 3: band closeTime -> [marks]
    this.cond4 = new Map();       // LTF Condition 4: band closeTime -> [marks]
    this.cond5 = new Map();       // LTF Condition 5: band closeTime -> [marks]
    this.bandWindows = [];
    this.lastState = null;
    this.lastLtfState = null;

    // HTF only: −2 outline box as a DOM overlay stacked above the canvases (§8 edit 3)
    if (key === 'htf') {
      this.outlineEl = document.createElement('div');
      this.outlineEl.className = 'conf-outline';
      this.chartEl.appendChild(this.outlineEl);
      this._outlineRaf = 0;
    }

    // LTF only: band primitive painted inside the chart canvas at bottom z-order (§5.4)
    if (key === 'ltf') {
      this._bandRenderer = { draw: (target) => this.drawBands(target) };
      this._bandView = {
        update() {},
        zOrder() { return 'bottom'; },
        renderer: () => this._bandRenderer,
      };
      this.series.attachPrimitive({
        attached: (p) => { this._bandRU = p.requestUpdate; },
        detached: () => { this._bandRU = null; },
        paneViews: () => [this._bandView],
      });
    }

    this.tfSec = Number(this.tfEl.value);
    this.candles = [];
    this.decimals = 2;
    this.seriesData = new Map();
    this.rsiAt = new Map();
    this.rsiMaAt = new Map();
    this._rangeLock = false;
    this._crossLock = false;

    // keep both time axes in step inside the panel.
    // LWC delivers these callbacks asynchronously, so a plain boolean guard
    // misses the echo: instead, skip when the target already has that range.
    const linkRange = (a, b) => a.timeScale().subscribeVisibleLogicalRangeChange((r) => {
      if (!r) return;
      const cur = b.timeScale().getVisibleLogicalRange();
      if (cur && Math.abs(cur.from - r.from) < 1e-6 && Math.abs(cur.to - r.to) < 1e-6) return;
      try { b.timeScale().setVisibleLogicalRange({ from: r.from, to: r.to }); } catch (e) { /* torn down */ }
    });
    linkRange(this.chart, this.rsiChart);
    linkRange(this.rsiChart, this.chart);
    if (this.spreadChart) {
      linkRange(this.chart, this.spreadChart);
      linkRange(this.spreadChart, this.chart);
    }

    /* Mirror the crosshair onto every OTHER chart of this panel (price / RSI / spread). */
    const mirror = (src, time) => {
      if (this._crossLock) return;
      this._crossLock = true;
      const put = {
        chart: () => {
          const c = time ? this.seriesData.get(time) : null;
          if (c) this.chart.setCrosshairPosition(c.close, time, this.series);
          else this.chart.clearCrosshairPosition();
        },
        rsi: () => {
          const v = time ? this.rsiAt.get(time) : null;
          if (v == null) this.rsiChart.clearCrosshairPosition();
          else this.rsiChart.setCrosshairPosition(v, time, this.rsiSeries);
        },
        spread: () => {
          if (!this.spreadChart) return;
          const p = time ? this.spreadAt.get(time) : null;
          if (!p) this.spreadChart.clearCrosshairPosition();
          else this.spreadChart.setCrosshairPosition(p.pct, time, this.spreadSeries);
        },
      };
      for (const k of Object.keys(put)) if (k !== src) put[k]();
      this._crossLock = false;
    };

    this.chart.subscribeCrosshairMove((param) => {
      const bar = param.time ? this.seriesData.get(param.time) : null;
      this.drawLegend(bar || this.candles[this.candles.length - 1]);
      this.drawRsiLegend(
        param.time
          ? { time: param.time, rsi: this.rsiAt.get(param.time), ma: this.rsiMaAt.get(param.time) }
          : this.lastRsiPoint
      );
      this.drawSpreadLegend(param.time);
      this.drawOiLegend(param.time);
      mirror('chart', param.time);
    });

    this.rsiChart.subscribeCrosshairMove((param) => {
      this.drawRsiLegend(
        param.time
          ? { time: param.time, rsi: this.rsiAt.get(param.time), ma: this.rsiMaAt.get(param.time) }
          : this.lastRsiPoint
      );
      this.drawLegend(param.time ? this.seriesData.get(param.time) : this.candles[this.candles.length - 1]);
      this.drawSpreadLegend(param.time);
      this.drawOiLegend(param.time);
      mirror('rsi', param.time);
    });

    if (this.spreadChart) {
      this.spreadChart.subscribeCrosshairMove((param) => {
        this.drawLegend(param.time ? this.seriesData.get(param.time) : this.candles[this.candles.length - 1]);
        this.drawRsiLegend(
          param.time
            ? { time: param.time, rsi: this.rsiAt.get(param.time), ma: this.rsiMaAt.get(param.time) }
            : this.lastRsiPoint
        );
        this.drawSpreadLegend(param.time);
        this.drawOiLegend(param.time);
        mirror('spread', param.time);
      });
    }

    // readout row — follows the crosshair on EITHER sub-chart of this panel
    const updateReadout = (param) => {
      if (this.key === 'htf') {
        this.drawConfirmLegend(param.time ? this.states.get(param.time + this.tfSec) : this.lastState, true);
      } else {
        this.drawConfirmLegend(param.time ? this.ltfBands.get(param.time) : this.lastLtfState, false);
      }
    };
    this.chart.subscribeCrosshairMove(updateReadout);
    this.rsiChart.subscribeCrosshairMove(updateReadout);
    if (this.spreadChart) this.spreadChart.subscribeCrosshairMove(updateReadout);

    if (this.outlineEl) {
      this.chart.timeScale().subscribeVisibleTimeRangeChange(() => this.scheduleOutline());
    }

    const watch = (el, target) => new ResizeObserver(() => {
      const w = el.clientWidth, h = el.clientHeight;
      if (w > 0 && h > 0) {
        target.applyOptions({ width: w, height: h });
        if (this === window.__panels[0] || this === window.__panels[1]) this.scheduleOutline();
        this.syncScaleWidths();
      }
    }).observe(el);
    watch(this.chartEl, this.chart);
    watch(this.rsiChartEl, this.rsiChart);
    if (this.spreadChart) watch(this.spreadChartEl, this.spreadChart);
    this.initTrendLines();
  }

  /* ---------- trend lines (src/trendlines.js) ----------
     Lines are kept as TIME + PRICE anchors per instrument / date / panel, drawn by a series primitive on the price chart,
     and saved in localStorage. Click "Trend line", then click two points; drag an end or the body to adjust; Delete removes
     the selected line; Esc cancels. Mouse handling is done on the chart element in the capture phase so that grabbing a line
     does not pan the chart. */
  initTrendLines() {
    this.lines = [];
    this.selectedId = null;
    this.draft = null;                    // { t1, p1, t2, p2 } while the first point is placed and the second is following the mouse
    this.parallelPreview = null;          // the parallel line following the mouse while the Parallel tool is armed
    this.drag = null;                     // { id, part, startT, startP, orig }
    this._linesRU = null;
    const renderer = { draw: (target) => this.drawLines(target) };
    const view = { update() {}, zOrder() { return 'top'; }, renderer: () => renderer };
    this.series.attachPrimitive({
      attached: (p) => { this._linesRU = p.requestUpdate; },
      detached: () => { this._linesRU = null; },
      paneViews: () => [view],
    });
    this.chartEl.addEventListener('mousedown', (e) => this.onLineDown(e), true);
    window.addEventListener('mousemove', (e) => this.onLineMove(e), true);
    window.addEventListener('mouseup', () => this.onLineUp(), true);
  }

  redrawLines() { if (this._linesRU) this._linesRU(); }

  /** Pane offset: the left price scale (HTF only) sits before the plot area. */
  paneLeft() { try { return this.chart.priceScale('left').width() || 0; } catch (e) { return 0; } }

  /** Mouse event -> plot-area pixel, or null when the pointer is outside the plot area. */
  plotPoint(e) {
    const r = this.chartEl.getBoundingClientRect();
    const pt = { x: e.clientX - r.left - this.paneLeft(), y: e.clientY - r.top };
    let sz; try { sz = this.chart.paneSize(); } catch (err) { sz = { width: this.chartEl.clientWidth, height: this.chartEl.clientHeight }; }
    pt.inside = pt.x >= 0 && pt.y >= 0 && pt.x <= sz.width && pt.y <= sz.height;
    pt.width = sz.width;
    return pt;
  }

  /**
   * Bar position <-> pixel, linear in between. The chart's own logicalToCoordinate() only answers for WHOLE bars (it returns 0
   * for 54.5) and coordinateToLogical() rounds to the nearest bar, so both are rebuilt from the pixels of bars 0 and 1 —
   * valid for any position, including before the first and after the last candle.
   */
  barToX(logical) {
    const ts = this.chart.timeScale();
    const a0 = ts.logicalToCoordinate(0), a1 = ts.logicalToCoordinate(1);
    return a0 === null || a1 === null ? null : a0 + logical * (a1 - a0);
  }
  xToBar(x) {
    const ts = this.chart.timeScale();
    const a0 = ts.logicalToCoordinate(0), a1 = ts.logicalToCoordinate(1);
    return a0 === null || a1 === null || a1 === a0 ? null : (x - a0) / (a1 - a0);
  }

  /** time -> x and price -> y for this panel's price chart (null while a coordinate is not available). */
  lineMap() {
    const t0 = this.candles.length ? this.candles[0].time : 0, tf = this.tfSec;
    return {
      x: (t) => this.barToX(TL_.toLogical(t0, tf, t)),
      y: (p) => this.series.priceToCoordinate(p),
    };
  }

  /** Pixel -> { t, p } anchor, or null when the chart cannot convert it. */
  anchorAt(pt) {
    if (!this.candles.length) return null;
    const logical = this.xToBar(pt.x);
    const price = this.series.coordinateToPrice(pt.y);
    if (logical === null || price === null || !Number.isFinite(logical) || !Number.isFinite(price)) return null;
    return { t: TL_.toTime(this.candles[0].time, this.tfSec, logical), p: price };
  }

  lineKey() { return TL_.key(app.symbol, app.date, this.key); }

  loadLines() {
    this.lines = (app.lines[this.lineKey()] || []).map((l) => Object.assign({}, l));
    this.selectedId = null; this.draft = null; this.drag = null; this.parallelPreview = null;
    this.redrawLines();
    if (typeof updateToolButtons === 'function') updateToolButtons();
  }

  saveLines() {
    app.lines[this.lineKey()] = this.lines.map((l) => Object.assign({}, l));
    TL_.saveAll(window.localStorage, app.lines);
  }

  selectedLine() { return this.lines.find((l) => l.id === this.selectedId) || null; }

  onLineDown(e) {
    if (e.button !== 0 || !this.candles.length) return;
    const pt = this.plotPoint(e);
    if (!pt.inside) return;
    if (app.parallelArmed) {                                   // Parallel tool: one click places the new line
      if (app.parallelPanel !== this) return;
      const base = this.selectedLine(), a = this.anchorAt(pt);
      e.stopPropagation(); e.preventDefault();
      const ln = base && a ? TL_.parallelThrough(base, a.t, a.p) : null;
      if (ln) { this.lines.push(ln); selectLine(this, ln.id); this.saveLines(); }
      setParallelArmed(false);
      return;
    }
    if (app.drawArmed) {                                       // placing the two points
      const a = this.anchorAt(pt);
      if (!a) return;
      e.stopPropagation(); e.preventDefault();
      if (!this.draft) {
        for (const o of panels) if (o !== this) o.draft = null, o.redrawLines();
        this.draft = { t1: a.t, p1: a.p, t2: a.t, p2: a.p };
      } else {
        if (a.t !== this.draft.t1 || a.p !== this.draft.p1) {
          const line = TL_.newLine(this.draft.t1, this.draft.p1, a.t, a.p,
            { color: document.getElementById('tl-color').value, extend: document.getElementById('tl-extend').checked });
          this.lines.push(line);
          selectLine(this, line.id);
          this.saveLines();
        }
        this.draft = null;
        setDrawArmed(false);
      }
      this.redrawLines();
      return;
    }
    const hit = TL_.hitTest(this.lines, this.lineMap(), pt.width, pt.x, pt.y);
    if (hit) {                                                 // grab a line: select it and start dragging
      e.stopPropagation(); e.preventDefault();
      selectLine(this, hit.id);
      const a = this.anchorAt(pt);
      this.drag = a ? { id: hit.id, part: hit.part, startT: a.t, startP: a.p, orig: Object.assign({}, this.selectedLine()) } : null;
      return;
    }
    if (this.selectedId) { selectLine(null, null); }           // clicked empty chart: deselect (the chart still pans)
  }

  onLineMove(e) {
    if (!this.candles.length) return;
    if (app.parallelArmed && app.parallelPanel === this) {     // preview of the parallel line through the mouse
      const r = this.chartEl.getBoundingClientRect();
      const a = this.anchorAt({ x: e.clientX - r.left - this.paneLeft(), y: e.clientY - r.top });
      const base = this.selectedLine();
      this.parallelPreview = a && base ? TL_.parallelThrough(base, a.t, a.p) : null;
      this.redrawLines();
      return;
    }
    if (this.draft || this.drag) {
      const r = this.chartEl.getBoundingClientRect();
      const pt = { x: e.clientX - r.left - this.paneLeft(), y: e.clientY - r.top };
      const a = this.anchorAt(pt);
      if (!a) return;
      if (this.draft) { this.draft.t2 = a.t; this.draft.p2 = a.p; this.redrawLines(); return; }
      const i = this.lines.findIndex((l) => l.id === this.drag.id);
      if (i < 0) return;
      this.lines[i] = this.drag.part === 'body'
        ? TL_.moved(this.drag.orig, a.t - this.drag.startT, a.p - this.drag.startP)
        : TL_.withAnchor(this.drag.orig, this.drag.part, a.t, a.p);
      this.redrawLines();
      return;
    }
    if (!app.drawArmed) {                                      // hover: show that a line can be grabbed
      const pt = this.plotPoint(e);
      this.chartEl.style.cursor = pt.inside && TL_.hitTest(this.lines, this.lineMap(), pt.width, pt.x, pt.y) ? 'pointer' : '';
    }
  }

  onLineUp() {
    if (!this.drag) return;
    this.drag = null;
    this.saveLines();
  }

  /** Paint the saved lines, the selection handles and the line being drawn (inside the chart canvas, above the candles). */
  drawLines(target) {
    if (!this.lines.length && !this.draft && !this.parallelPreview) return;
    if (!target || typeof target.useMediaCoordinateSpace !== 'function') return;
    target.useMediaCoordinateSpace(({ context, mediaSize }) => {
      const map = this.lineMap();
      const paint = (line, selected, dashed) => {
        const s = TL_.screenPoints(line, map, mediaSize.width);
        if (!s) return;
        context.save();
        context.strokeStyle = line.color;
        context.lineWidth = 1;                // 1 px for every line; a selected line is shown by its two handles
        context.setLineDash(dashed ? [6, 4] : []);
        context.beginPath(); context.moveTo(s.x1, s.y1); context.lineTo(s.ex, s.ey); context.stroke();
        if (selected) {
          context.setLineDash([]);
          context.fillStyle = '#131722';
          for (const [x, y] of [[s.x1, s.y1], [s.x2, s.y2]]) {
            context.beginPath(); context.arc(x, y, 5, 0, Math.PI * 2); context.fill(); context.stroke();
          }
        }
        context.restore();
      };
      for (const l of this.lines) paint(l, l.id === this.selectedId, false);
      if (this.draft) paint(Object.assign({ id: 'draft', color: document.getElementById('tl-color').value, extend: false }, this.draft), false, true);
      if (this.parallelPreview) paint(this.parallelPreview, false, true);
    });
  }

  /* ---------- confirmation rendering ---------- */

  /** Paint the five-candle windows into the chart canvas at bottom z-order (§5.4). */
  drawBands(target) {
    if (!app.confirmOn || !this.bandWindows.length) return;
    if (!target || typeof target.useMediaCoordinateSpace !== 'function') return;
    target.useMediaCoordinateSpace(({ context }) => {
      const h = context.canvas.height;
      for (const w of this.bandWindows) {
        const x1 = this.chart.timeScale().timeToCoordinate(w.from);
        const x2 = this.chart.timeScale().timeToCoordinate(w.to);
        if (x1 == null || x2 == null || !(x2 > x1)) continue;
        context.fillStyle = w.pattern === 'A' ? 'rgba(41,98,255,0.10)' : 'rgba(255,152,0,0.10)';
        context.fillRect(x1, 0, x2 - x1, h);
      }
    });
  }

  setBandWindows(windows) {
    this.bandWindows = windows || [];
    if (this._bandRU) this._bandRU();
  }

  /** Position the −2 outline box over its candle (HTF only). */
  updateOutline() {
    const el = this.outlineEl;
    if (!el) return;
    const show = app.confirmOn && this.outlineTime != null && this.outlineHigh != null;
    if (!show) { el.style.display = 'none'; return; }

    const ts = this.chart.timeScale();
    const x1 = ts.timeToCoordinate(this.outlineTime);
    const x2 = ts.timeToCoordinate(this.outlineTime + this.tfSec);
    const y1 = this.series.priceToCoordinate(this.outlineHigh);
    const y2 = this.series.priceToCoordinate(this.outlineLow);
    if (x1 == null || x2 == null || y1 == null || y2 == null) { el.style.display = 'none'; return; }

    const pad = 3;
    el.style.display = 'block';
    el.style.left = (Math.min(x1, x2) - pad) + 'px';
    el.style.width = (Math.abs(x2 - x1) + pad * 2) + 'px';
    el.style.top = (Math.min(y1, y2) - pad) + 'px';
    el.style.height = (Math.abs(y2 - y1) + pad * 2) + 'px';
  }

  scheduleOutline() {
    if (!this.outlineEl || this._outlineRaf) return;
    this._outlineRaf = requestAnimationFrame(() => {
      this._outlineRaf = 0;
      this.updateOutline();
    });
  }

  /** Remove every confirmation visual without touching any series data. */
  clearConfirm() {
    this.states = new Map();
    this.ltfBands = new Map();
    this.cond1 = new Map();
    this.cond2 = new Map();
    this.cond3 = new Map();
    this.cond4 = new Map();
    this.cond5 = new Map();
    this.lastState = null;
    this.lastLtfState = null;
    this.outlineTime = null;
    this.outlineHigh = null;
    this.outlineLow = null;
    this.series.setMarkers([]);
    this.setBandWindows([]);
    if (this.outlineEl) this.outlineEl.style.display = 'none';
    if (this.confirmLegendEl) this.confirmLegendEl.innerHTML = '';
  }

  /** LTF readout chip for Condition 1 (RSI 50 cross) of the hovered band — '' when not applicable. */
  cond1Chip(state) {
    if (!app.ltfOn || LTF_COND1.mode === 'off' || state.state !== TC.STATE.MATCHED) return '';
    if (LTF_COND1.mode === 'error') {
      return ' <span class="grp">C1</span> <span class="st na">Config error</span>' +
             '<span class="hint">' + LTF_COND1.problems[0] + '</span>';
    }
    const ms = this.cond1.get(state.closeTime);
    if (!ms || !ms.length) return ' <span class="grp">C1</span> <span class="hint">no cross</span>';
    const last = ms[ms.length - 1];
    return ' <span class="grp">C1</span> <span class="st ' + last.pattern.toLowerCase() + '">' +
      (last.pattern === 'A' ? '⬆' : '⬇') + ' ' +
      ms.map((m) => fmtTime.format(new Date(m.time * 1000))).join(', ') + '</span>' +
      '<span class="hint">' + (ms.length > 1 ? 'last: ' : '') + 'RSI ' + last.rsi.toFixed(1) +
      ' (prev ' + last.prevRsi.toFixed(1) + ')</span>';
  }

  /** LTF readout chip for Condition 2 (SMA trend filter on C1) of the hovered band. */
  cond2Chip(state) {
    if (!app.ltfOn || LTF_COND2.mode === 'off' || LTF_COND1.mode !== 'active' ||
        state.state !== TC.STATE.MATCHED) return '';
    if (LTF_COND2.mode === 'error') {
      return ' <span class="grp">C2</span> <span class="st na">Config error</span>' +
             '<span class="hint">' + LTF_COND2.problems[0] + '</span>';
    }
    const ms = this.cond2.get(state.closeTime);
    if (!ms || !ms.length) return ' <span class="grp">C2</span> <span class="hint">none</span>';
    const last = ms[ms.length - 1];
    return ' <span class="grp">C2</span> <span class="st ' + last.pattern.toLowerCase() + '">' +
      (last.pattern === 'A' ? '⬆' : '⬇') + ' ' +
      ms.map((m) => fmtTime.format(new Date(m.time * 1000))).join(', ') + '</span>' +
      '<span class="hint">' + (ms.length > 1 ? 'last: ' : '') + 'SMA' + LTF_COND2.cfg.fastPeriod + ' ' +
      last.smaFast.toFixed(1) + (last.pattern === 'A' ? ' > ' : ' < ') +
      'SMA' + LTF_COND2.cfg.slowPeriod + ' ' + last.smaSlow.toFixed(1) + '</span>';
  }

  /** LTF readout chip for Condition 3 (SMA spread band on C1 + C2) of the hovered band. */
  cond3Chip(state) {
    if (!app.ltfOn || LTF_COND3.mode === 'off' || LTF_COND1.mode !== 'active' ||
        state.state !== TC.STATE.MATCHED) return '';
    if (LTF_COND3.mode === 'error') {
      return ' <span class="grp">C3</span> <span class="st na">Config error</span>' +
             '<span class="hint">' + LTF_COND3.problems[0] + '</span>';
    }
    if (LTF_COND2.mode !== 'active') return ' <span class="grp">C3</span> <span class="hint">needs C2</span>';
    const ms = this.cond3.get(state.closeTime);
    if (!ms || !ms.length) return ' <span class="grp">C3</span> <span class="hint">none</span>';
    const last = ms[ms.length - 1];
    const band = LTF_COND3.cfg;
    return ' <span class="grp">C3</span> <span class="st ' + last.pattern.toLowerCase() + '">' +
      (last.pattern === 'A' ? '⬆' : '⬇') + ' ' +
      ms.map((m) => fmtTime.format(new Date(m.time * 1000))).join(', ') + '</span>' +
      '<span class="hint">' + (ms.length > 1 ? 'last: ' : '') + 'spread ' + (last.spreadPct > 0 ? '+' : '') +
      last.spreadPct.toFixed(3) + '% (' + (last.pattern === 'A'
        ? band.minPct + ' < x ≤ ' + band.maxPct
        : '−' + band.maxPct + ' ≤ x < −' + band.minPct) + ')</span>';
  }

  /** LTF readout chip for Condition 4 (SMA-of-RSI extreme in the previous candles) of the hovered band. */
  cond4Chip(state) {
    if (!app.ltfOn || LTF_COND4.mode === 'off' || LTF_COND1.mode !== 'active' ||
        state.state !== TC.STATE.MATCHED) return '';
    if (LTF_COND4.mode === 'error') {
      return ' <span class="grp">C4</span> <span class="st na">Config error</span>' +
             '<span class="hint">' + LTF_COND4.problems[0] + '</span>';
    }
    if (LTF_COND2.mode !== 'active' || LTF_COND3.mode !== 'active') {
      return ' <span class="grp">C4</span> <span class="hint">needs C2 + C3</span>';
    }
    const ms = this.cond4.get(state.closeTime);
    if (!ms || !ms.length) return ' <span class="grp">C4</span> <span class="hint">none</span>';
    const last = ms[ms.length - 1];
    return ' <span class="grp">C4</span> <span class="st ' + last.pattern.toLowerCase() + '">' +
      (last.pattern === 'A' ? '⬆' : '⬇') + ' ' +
      ms.map((m) => fmtTime.format(new Date(m.time * 1000))).join(', ') + '</span>' +
      '<span class="hint">' + (ms.length > 1 ? 'last: ' : '') + 'SMA-RSI ' + last.hitValue.toFixed(1) + ' @ ' +
      fmtTime.format(new Date(last.hitTime * 1000)) + ' (' + (last.pattern === 'A'
        ? '> ' + LTF_COND4.cfg.aMin + (LTF_COND4.cfg.aMax < 100 ? ' and ≤ ' + LTF_COND4.cfg.aMax : '')
        : '< ' + LTF_COND4.cfg.bMax + (LTF_COND4.cfg.bMin > 0 ? ' and ≥ ' + LTF_COND4.cfg.bMin : '')) + ')</span>';
  }

  /** LTF readout chip for Condition 5 (back candle distance vs E candle distance). */
  cond5Chip(state) {
    if (!app.ltfOn || LTF_COND5.mode === 'off' || LTF_COND1.mode !== 'active' ||
        state.state !== TC.STATE.MATCHED) return '';
    if (LTF_COND5.mode === 'error') {
      return ' <span class="grp">C5</span> <span class="st na">Config error</span>' +
             '<span class="hint">' + LTF_COND5.problems[0] + '</span>';
    }
    if (LTF_COND2.mode !== 'active' || LTF_COND3.mode !== 'active' || LTF_COND4.mode !== 'active') {
      return ' <span class="grp">C5</span> <span class="hint">needs C2 + C3 + C4</span>';
    }
    const ms = this.cond5.get(state.closeTime);
    if (!ms || !ms.length) return ' <span class="grp">C5</span> <span class="hint">none</span>';
    const last = ms[ms.length - 1], d = this.decimals;
    return ' <span class="grp">C5</span> <span class="st ' + last.pattern.toLowerCase() + '">' +
      (last.pattern === 'A' ? '⬆' : '⬇') + ' ' +
      ms.map((m) => fmtTime.format(new Date(m.time * 1000))).join(', ') + '</span>' +
      '<span class="hint">' + (ms.length > 1 ? 'last: ' : '') + 'back ' + last.backDistance.toFixed(d) +
      ' > ' + last.multiplier + ' × e ' + last.eDistance.toFixed(d) + '</span>';
  }

  /** Readout row: HTF shows the per-condition breakdown, LTF shows its window state. */
  drawConfirmLegend(state, isHtf) {
    const el = this.confirmLegendEl;
    if (!el) return;
    if (!app.confirmOn) { el.innerHTML = ''; return; }
    if (!state) { el.innerHTML = '<span>' + (isHtf ? 'HTF CONF' : 'HTF → LTF') + ' <b>—</b></span>'; return; }

    const stamp = fmtTime.format(new Date((isHtf ? state.closeTime : state.closeTime) * 1000));

    if (!isHtf) {
      el.innerHTML =
        '<span class="t">' + stamp + '</span>' +
        '<span class="hint">window ends</span>' + stateLabel(state) + this.cond1Chip(state) + this.cond2Chip(state) + this.cond3Chip(state) + this.cond4Chip(state) + this.cond5Chip(state);
      return;
    }

    // fail-closed config error (approved Q3 / P6): replaces the per-candle
    // breakdown; shows the first problem of EITHER section, section-prefixed
    if (CONFIG_ERROR) {
      el.innerHTML =
        '<span class="t">' + stamp + '</span>' +
        '<span class="st na">Config error</span>' +
        '<span class="hint">' + CONFIG_PROBLEMS[0] + '</span>';
      return;
    }

    if (state.state === TC.STATE.UNAVAILABLE) {
      el.innerHTML =
        '<span class="t">' + stamp + '</span>' +
        '<span class="st na">Unavailable</span>' +
        '<span class="hint">' + (state.reason === 'insufficient-history' ? 'first 5 candles' : 'incomplete history') + '</span>';
      return;
    }

    const c = state.conditions;
    const mark = (b) => b ? '<span class="ok">✓</span>' : '<span class="bad">✗</span>';
    // chips appear only in mode 'active' — an off section renders nothing (T19/T26/T31)
    const slopeChip = (gate) => SLOPE_FILTER.mode !== 'active' ? '' :
      ' <span class="grp">slope</span> ' +
      (c.slope == null ? '<span class="hint">–</span>'
                       : (c.slope > 0 ? '+' : '') + c.slope.toFixed(3) + ' ' + mark(gate));
    const rsiChip = (gate) => SLOPE_FILTER.rsi.mode !== 'active' ? '' :
      ' <span class="grp">rsi</span> ' +
      (c.rsi == null ? '<span class="hint">–</span>'
                     : c.rsi.toFixed(2) + ' ' + mark(gate));
    const oiChip = (gate) => SLOPE_FILTER.oi.mode !== 'active' ? '' :
      ' <span class="grp">oi</span> ' +
      (c.oiPe == null ? '<span class="hint">–</span>'
                      : 'PE ' + TF_.fmtCompact(c.oiPe) + ' CE ' + TF_.fmtCompact(c.oiCe) + ' ' + mark(gate));
    el.innerHTML =
      '<span class="t">' + stamp + '</span>' +
      '<span class="grp">A:</span> c1 ' + mark(c.c1) + ' c3 ' + mark(c.red2) + ' c4 ' + mark(c.red1) +
        ' 5A ' + mark(c.c5aA) + ' 5B ' + mark(c.c5bA) + slopeChip(c.slopeA) + rsiChip(c.rsiA) + oiChip(c.oiA) +
      '<span class="grp">B:</span> c1 ' + mark(c.c2) + ' c3 ' + mark(c.green2) + ' c4 ' + mark(c.green1) +
        ' 5A ' + mark(c.c5aB) + ' 5B ' + mark(c.c5bB) + slopeChip(c.slopeB) + rsiChip(c.rsiB) + oiChip(c.oiB) +
      stateLabel(state);
  }

  /* ---------- end confirmation rendering ---------- */

  /**
   * Pixel-align the two sub-charts of this panel. The right price scales size
   * themselves to their widest label (e.g. 66px for "22600.00" vs 48px for
   * "100.0"), which makes the plot widths — and therefore the bar spacing of two
   * identically-ranged time axes — differ, so the same timestamp sat at different
   * x pixels on the price and RSI charts (the mirrored crosshair looked off by
   * ~15–30px). Floor both scales to the same width; no-op once equal.
   *
   * @returns {boolean} true when options were applied — the caller must re-fit
   *   afterwards, because the relayout lands after a synchronous fitContent.
   */
  syncScaleWidths() {
    // each chart's side price scales size themselves to their widest label (e.g. "22600.00" vs "100.0"), which makes the
    // plot widths — and the bar spacing of the shared time axis — differ between the stacked charts. Equalize the scale
    // WIDTHS side by side (right scale on every chart of the panel; the left scale on the two HTF charts that carry one).
    const all = [this.chart, this.rsiChart].concat(this.spreadChart ? [this.spreadChart] : []);
    const measure = (ch, side) => {
      const el = ch.chartElement();
      if (!el || el.getBoundingClientRect().width < 2) return null;
      try { const w = ch.priceScale(side).width(); return w > 0 ? w : null; } catch (e) { return null; }
    };
    let changed = false;
    for (const side of this.key === 'htf' ? ['right', 'left'] : ['right']) {
      const group = side === 'left' ? [this.chart, this.rsiChart] : all;
      const widths = group.map((ch) => measure(ch, side));
      if (widths.some((w) => w == null) || widths.every((w) => w === widths[0])) continue;
      const target = Math.max(...widths);
      group.forEach((ch) => ch.applyOptions({ [side + 'PriceScale']: { minimumWidth: target } }));
      changed = true;
    }
    return changed;
  }

  render(fit) {
    const ticks = getTicks(app.symbol, app.date);
    this.decimals = (DATA.instruments[app.symbol] || {}).decimals || 2;
    this.symbolEl.textContent = app.symbol + (app.date ? ' · ' + app.date : '');

    if (!ticks) {
      this.series.setData([]);
      this.smaSeries.setData([]);
      if (this.sma44Series) this.sma44Series.setData([]);
      this.rsiSeries.setData([]);
      this.rsiMaSeries.setData([]);
      if (this.spreadSeries) this.spreadSeries.setData([]);
      this.spreadAt = new Map();
      if (this.ceSeries) { this.ceSeries.setData([]); this.peSeries.setData([]); }
      this.oiAt = new Map();
      if (this.oiLegendEl) this.oiLegendEl.innerHTML = '';
      this.lines = []; this.selectedId = null; this.draft = null; this.drag = null; this.redrawLines();
      this.countEl.textContent = 'no data';
      this.legendEl.innerHTML = '';
      this.rsiLegendEl.innerHTML = '';
      if (this.spreadLegendEl) this.spreadLegendEl.innerHTML = '';
      return;
    }

    this.candles = buildCandles(ticks, this.tfSec);
    this.series.setData(this.candles);
    this.seriesData = new Map(this.candles.map((c) => [c.time, c]));
    this.countEl.textContent = this.candles.length + ' bars · ' + TF_LABELS[this.tfSec];

    /* indicators are computed from THIS panel's candles only */
    const closes = this.candles.map((c) => c.close);
    const sma9 = smaNullable(closes, 9);
    const sma44 = this.sma44Series ? smaNullable(closes, 44) : null;
    const rsi14 = rsi(closes, 14);              // Wilder RSI 14
    const rsiMa14 = smaNullable(rsi14, 14);     // SMA 14 of the RSI values

    this.smaSeries.setData(
      this.candles.flatMap((c, i) => (sma9[i] == null ? [] : [{ time: c.time, value: sma9[i] }]))
    );
    if (this.sma44Series) {
      this.sma44Series.setData(
        this.candles.flatMap((c, i) => (sma44[i] == null ? [] : [{ time: c.time, value: sma44[i] }]))
      );
    }

    this.rsiAt = new Map();
    this.rsiMaAt = new Map();
    const rsiData = [], maData = [];
    this.candles.forEach((c, i) => {
      if (rsi14[i] != null) {
        this.rsiAt.set(c.time, rsi14[i]);
        rsiData.push({ time: c.time, value: rsi14[i] });
      } else {
        // whitespace point for the RSI warm-up bars: it occupies no pixels but keeps
        // this chart's logical index space identical to the price chart above it —
        // without it the shared time axes and the mirrored crosshair sat 14 bars apart
        rsiData.push({ time: c.time });
      }
      if (rsiMa14[i] != null) {
        this.rsiMaAt.set(c.time, rsiMa14[i]);
        maData.push({ time: c.time, value: rsiMa14[i] });
      }
    });
    this.rsiSeries.setData(rsiData);
    this.rsiMaSeries.setData(maData);
    this.lastRsiPoint = rsiData.length
      ? { time: rsiData[rsiData.length - 1].time, rsi: rsiData[rsiData.length - 1].value,
          ma: maData.length ? maData[maData.length - 1].value : null }
      : null;

    if (this.spreadSeries) {
      // spread % = (SMA 9 - SMA 44) / SMA 44 * 100 from the SAME arrays the lines plot
      const sp = TL.spreadPct(sma9, sma44);
      this.spreadAt = new Map();
      const spData = this.candles.map((c, i) => {
        if (sp[i] == null) return { time: c.time };      // warm-up: keeps the logical index space aligned
        this.spreadAt.set(c.time, { pct: sp[i], fast: sma9[i], slow: sma44[i] });
        return { time: c.time, value: sp[i], color: sp[i] >= 0 ? '#26a69a' : '#ef5350' };
      });
      this.spreadSeries.setData(spData);
    }

    if (this.ceSeries) {
      // CE / PE open-interest change of each candle = the per-minute changes of the minutes that ended inside it
      const per = TF_.changePerCandle(ticks.meta.flow, this.candles, this.tfSec);
      this.oiAt = new Map();
      const ceData = [], peData = [];
      this.candles.forEach((c, i) => {
        const a = per[i];
        if (!a) { ceData.push({ time: c.time }); peData.push({ time: c.time }); return; }   // whitespace keeps the index space aligned
        this.oiAt.set(c.time, a);
        ceData.push({ time: c.time, value: a.dce });
        peData.push({ time: c.time, value: a.dpe });
      });
      this.ceSeries.setData(ceData);
      this.peSeries.setData(peData);
    }

    this.drawLegend(this.candles[this.candles.length - 1]);
    this.drawRsiLegend(this.lastRsiPoint);
    this.drawSpreadLegend(null);
    this.drawOiLegend(null);
    this.loadLines();                          // this instrument / date / panel's saved trend lines
    const rescaled = this.syncScaleWidths();   // equal plot widths ⇒ aligned time axes
    if (fit !== false) {
      const fitAll = () => {
        this.chart.timeScale().fitContent();
        this.rsiChart.timeScale().fitContent();
        if (this.spreadChart) this.spreadChart.timeScale().fitContent();
      };
      fitAll();
      // a scale resize re-anchors the view after this tick — refit once it has
      // landed, so the session still starts at bar 0 (no left-edge crop at load)
      if (rescaled) requestAnimationFrame(fitAll);
    }
  }

  /** HTF option-chain readout: the CE and PE open-interest change of the hovered candle (latest candle at rest). */
  drawOiLegend(time) {
    const el = this.oiLegendEl;
    if (!el) return;
    let t = time, p = t ? this.oiAt.get(t) : null;
    if (!p) {
      for (let i = this.candles.length - 1; i >= 0 && !p; i--) {
        const q = this.oiAt.get(this.candles[i].time);
        if (q) { p = q; t = this.candles[i].time; }
      }
    }
    if (!p) { el.innerHTML = '<span>CE OI change <b>—</b></span><span>PE OI change <b>—</b></span><span class="hint">no option-chain flow for this session</span>'; return; }
    el.innerHTML =
      '<span class="t">' + fmtTime.format(new Date(p.lastSnapshot * 1000)) + '</span>' +
      '<span>CE OI change <b class="ce-v">' + TF_.fmtFull(p.dce) + '</b></span>' +
      '<span>PE OI change <b class="pe-v">' + TF_.fmtFull(p.dpe) + '</b></span>' +
      '<span class="hint">' + (p.minutes === 1 ? 'the minute ending here' : 'sum of ' + p.minutes + ' minutes in this candle') + '</span>';
  }

  /** LTF spread readout: the hovered candle's SMA 9 / SMA 44 and their % distance (last candle at rest). */
  drawSpreadLegend(time) {
    const el = this.spreadLegendEl;
    if (!el) return;
    let t = time, p = t ? this.spreadAt.get(t) : null;
    if (!p) {                                    // at rest / warm-up: latest candle that has a value
      for (let i = this.candles.length - 1; i >= 0 && !p; i--) {
        const q = this.spreadAt.get(this.candles[i].time);
        if (q) { p = q; t = this.candles[i].time; }
      }
    }
    if (!p) { el.innerHTML = '<span>SMA 9 / SMA 44 <b>—</b></span>'; return; }
    const d = this.decimals;
    el.innerHTML =
      '<span class="t">' + fmtTime.format(new Date(t * 1000)) + '</span>' +
      '<span>SMA 9 <b>' + p.fast.toFixed(d) + '</b></span>' +
      '<span>SMA 44 <b>' + p.slow.toFixed(d) + '</b></span>' +
      '<span>Spread <b class="' + (p.pct >= 0 ? 'pos' : 'neg') + '">' + (p.pct > 0 ? '+' : '') + p.pct.toFixed(3) + '%</b></span>';
  }

  drawRsiLegend(point) {
    if (!point || point.rsi == null) {
      this.rsiLegendEl.innerHTML = '<span>RSI 14 <b>—</b></span><span>SMA 14 <b>—</b></span>';
      return;
    }
    const t = fmtTime.format(new Date(point.time * 1000));
    this.rsiLegendEl.innerHTML =
      '<span class="t">' + t + '</span>' +
      '<span>RSI 14 <b class="rsi-v">' + point.rsi.toFixed(2) + '</b></span>' +
      '<span>SMA 14 <b class="ma-v">' + (point.ma == null ? '—' : point.ma.toFixed(2)) + '</b></span>';
  }

  drawLegend(bar) {
    if (!bar) { this.legendEl.innerHTML = ''; return; }
    const up = bar.close >= bar.open;
    const d = this.decimals;
    const stamp = fmtTime.format(new Date(bar.time * 1000));
    this.legendEl.innerHTML =
      '<span class="t">' + stamp + '</span>' +
      '<span><span class="k">O</span><span class="v">' + fmtPrice(bar.open, d) + '</span></span>' +
      '<span><span class="k">H</span><span class="v">' + fmtPrice(bar.high, d) + '</span></span>' +
      '<span><span class="k">L</span><span class="v">' + fmtPrice(bar.low, d) + '</span></span>' +
      '<span><span class="k">C</span><span class="v">' + fmtPrice(bar.close, d) + '</span></span>' +
      '<span class="' + (up ? 'up' : 'down') + '">' + (up ? '▲' : '▼') + ' ' + bar.close.toFixed(d) + '</span>';
  }
}

/* ---------- cross-panel crosshair + view sync (HTF ⇄ LTF) ----------
   Each panel already mirrors its own price ⇄ RSI crosshair. This extends the same
   idea across the two panels: hovering either sub-chart of one panel pins the
   other panel's charts at the same MOMENT (snapped to the other timeframe's own
   containing candle) and redraws its legends and confirmation readout, so both
   panels always point at the same time. Lightweight Charts does NOT re-fire
   subscribeCrosshairMove for a programmatic setCrosshairPosition (measured), so
   the mirror does the target's whole job by hand — and because the target's own
   handlers never run, no re-entrancy lock is needed. */
function containingCandle(panel, t) {
  const arr = panel.candles;
  let lo = 0, hi = arr.length - 1, ans = -1;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    if (arr[mid].time <= t) { ans = mid; lo = mid + 1; } else hi = mid - 1;
  }
  if (ans < 0) return null;
  const c = arr[ans];
  return t < c.time + panel.tfSec ? c : null;   // t beyond the last candle's window
}

function mirrorCrosshair(from, to) {
  const atRest = () => {
    to.chart.clearCrosshairPosition();
    to.rsiChart.clearCrosshairPosition();
    to.drawLegend(to.candles[to.candles.length - 1]);
    to.drawRsiLegend(to.lastRsiPoint);
    to.drawConfirmLegend(to.key === 'htf' ? to.lastState : to.lastLtfState, to.key === 'htf');
  };
  const apply = (param) => {
    if (param.time == null) { atRest(); return; }
    const c = containingCandle(to, param.time);
    if (!c) { atRest(); return; }
    to.chart.setCrosshairPosition(c.close, c.time, to.series);
    const v = to.rsiAt.get(c.time);
    if (v == null) to.rsiChart.clearCrosshairPosition();
    else to.rsiChart.setCrosshairPosition(v, c.time, to.rsiSeries);
    to.drawLegend(c);
    to.drawRsiLegend(v == null ? to.lastRsiPoint
                               : { time: c.time, rsi: v, ma: to.rsiMaAt.get(c.time) });
    if (to.key === 'htf') to.drawConfirmLegend(to.states.get(c.time + to.tfSec), true);
    else to.drawConfirmLegend(to.ltfBands.get(c.time), false);
  };
  from.chart.subscribeCrosshairMove(apply);
  from.rsiChart.subscribeCrosshairMove(apply);
}
mirrorCrosshair(htfPanel, ltfPanel);
mirrorCrosshair(ltfPanel, htfPanel);

/* Keep both panels' visible time windows together so the mirrored lines and the
   time axes stay at the same screen x after any zoom/scroll (the user-facing
   "parallel" behaviour). Lightweight Charts measures a logical range inclusively —
   barSpacing = width / (to − from + 1) — and anchors a bar's time to its slot
   CENTER (x = (l − from)·bs + bs/2). A naive seconds conversion therefore left the
   two panels off by one whole slot (HTF 300s vs LTF 60s → ±10.7px at the window
   edges, measured). Converting with the matching half-slot padding
   (l_dst = k·l_src ∓ (k−1)/2, k = src.tfSec/dst.tfSec) restores both the slope and
   the intercept: measured dx = 0 at the window start, middle and end. The mapping
   round-trips exactly (k → 1/k), so the echo settles on the first compare — same
   epsilon guard as the intra-panel link above. */
function linkPanelWindows(a, b) {
  const convert = (r, srcTf, dstTf) => {
    const k = srcTf / dstTf;
    return { from: k * r.from - (k - 1) / 2, to: k * r.to + (k - 1) / 2 };
  };
  const oneWay = (src, dst) => src.chart.timeScale().subscribeVisibleLogicalRangeChange((r) => {
    if (!r || !src.candles.length || !dst.candles.length) return;
    const want = convert(r, src.tfSec, dst.tfSec);
    const cur = dst.chart.timeScale().getVisibleLogicalRange();
    if (cur && Math.abs(cur.from - want.from) < 1e-6 && Math.abs(cur.to - want.to) < 1e-6) return;
    try { dst.chart.timeScale().setVisibleLogicalRange(want); } catch (e) { /* torn down */ }
  });
  oneWay(a, b);
  oneWay(b, a);
}
linkPanelWindows(htfPanel, ltfPanel);

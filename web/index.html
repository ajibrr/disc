    // browser console (F12 / Cmd+Option+J): the same numbers as the badge plus a trade-by-trade table
    if (replaying) {
      // no console output while replaying (it would write a table at every step)
    } else if (sum.trades) {
      const hm = (t) => fmtTime.format(new Date(t * 1000));
      console.groupCollapsed('[' + SEL.name + '] ' + app.symbol + ' ' + app.date + ' ' + TF_LABELS[ltfSec] + ' — ' + sum.trades + ' trades, ' +
        sum.wins + ' wins / ' + sum.losses + ' losses, hit ' + (sum.winRate * 100).toFixed(1) + '%, P&L ' + sg(sum.totalPnl) + ' pts');
      console.table(sim.trades.map((t) => ({
        side: t.side, signal: hm(t.signalTime), entry: hm(t.entryTime), 'entry px': +t.entryPrice.toFixed(d),
        risk: +t.risk.toFixed(d), stop: +t.stop.toFixed(d), target: +t.target.toFixed(d),
        exit: hm(t.exitTime), 'exit px': +t.exitPrice.toFixed(d), why: t.exitReason, 'P&L': +t.pnl.toFixed(2), R: +t.r.toFixed(2),
      })));
      console.log('wins ' + sum.wins + ' · losses ' + sum.losses + ' · hit ratio ' + (sum.winRate * 100).toFixed(1) + '% · total P&L ' + sg(sum.totalPnl) +
        ' · avg/trade ' + sg(sum.avgPnl) + ' · profit factor ' + pf(sum.profitFactor) + ' · max drawdown ' + sum.maxDrawdown.toFixed(2) +
        ' · longest losing streak ' + sum.maxConsecLosses + ' · skipped ' + sim.skipped.length);
      console.groupEnd();
    } else {
      console.info('[' + SEL.name + '] ' + app.symbol + ' ' + app.date + ' ' + TF_LABELS[ltfSec] + ' — no trades (' + sim.skipped.length + ' skipped)');
    }
    if (!sum.trades) {
      stratBadge.className = 'conf-badge strat-badge on';
      stratBadge.textContent = SEL.title + ': no trades';
      stratBadge.title = 'No full ' + (chain.fullKind || 'C1+C2+C3+C4+C5') + ' signal on this session / timeframe (' + sim.skipped.length + ' skipped)';
    } else {
      stratBadge.className = 'conf-badge strat-badge on ' + (sum.totalPnl > 0 ? 'pos' : sum.totalPnl < 0 ? 'neg' : '');
      stratBadge.textContent = SEL.title + ': ' + sum.trades + (sum.trades === 1 ? ' trade' : ' trades') + ' · hit ' +
        Math.round(sum.winRate * 100) + '% · P&L ' + sg(sum.totalPnl) + ' pts';
      stratBadge.title =
        SEL.title + ' back-test of this session on this timeframe (points, size 1, no costs unless set)\n' +
        'Trades ' + sum.trades + ' (long ' + sum.long.trades + ', short ' + sum.short.trades + ')   skipped ' + sim.skipped.length + '\n' +
        'Wins ' + sum.wins + '   Losses ' + sum.losses + '   Hit ratio ' + (sum.winRate * 100).toFixed(1) + '%\n' +
        'Exits: target ' + sum.targetHits + ', stop ' + sum.stopHits + ', hard exit ' + sum.hardExits + ', end of session ' + sum.eodExits + '\n' +
        'Total P&L ' + sg(sum.totalPnl) + '   Avg/trade ' + sg(sum.avgPnl) + '   Avg R ' + sg(sum.avgR) + '\n' +
        'Avg win ' + (sum.avgWin === null ? '—' : sg(sum.avgWin)) + '   Avg loss ' + (sum.avgLoss === null ? '—' : sg(sum.avgLoss)) + '\n' +
        'Profit factor ' + pf(sum.profitFactor) + '   Max drawdown ' + sum.maxDrawdown.toFixed(2) + '   Longest losing streak ' + sum.maxConsecLosses;
    }
  } else if (REGISTRY.mode === 'error') {
    stratBadge.className = 'conf-badge strat-badge on';
    stratBadge.textContent = 'Strategy: Config error';
    stratBadge.title = REGISTRY.problems.join('; ');
  } else if (!SEL) {
    stratBadge.className = 'conf-badge strat-badge';
    stratBadge.textContent = '';
    stratBadge.title = 'No strategy is switched on in config/strategies.json';
  }
  ltfMarkers.sort((x, y) => x.time - y.time);
  ltfPanel.series.setMarkers(ltfMarkers);
  // the newest LTF candle may sit past the last window (partial tail bar), so fall back
  // to the most recent candle that actually has a window
  ltfPanel.lastLtfState = null;
  ltfBands.forEach((s) => {
    if (!ltfPanel.lastLtfState || s.closeTime > ltfPanel.lastLtfState.closeTime) ltfPanel.lastLtfState = s;
  });

  // badge — latest eligible completed candle only (§6.10)
  if (last) {
    const t = fmtTime.format(new Date(last.closeTime * 1000));
    if (CONFIG_ERROR) {
      badge.className = 'conf-badge on';
      badge.textContent = 'HTF: Config error';
    } else if (last.state === TC.STATE.MATCHED) {
      badge.className = 'conf-badge on ' + last.pattern.toLowerCase();
      badge.textContent = 'HTF: Matched ' + last.pattern + ' · ' + t;
    } else if (last.state === TC.STATE.NOT_MATCHED) {
      badge.className = 'conf-badge on';
      badge.textContent = 'HTF: Not Matched · ' + t;
    } else {
      badge.className = 'conf-badge on';
      badge.textContent = 'HTF: Unavailable · ' + t;
    }
  }

  // readouts at rest (the crosshair subscription takes over on hover)
  htfPanel.drawConfirmLegend(last, true);
  ltfPanel.drawConfirmLegend(ltfPanel.lastLtfState, false);
}

/* ---------------- bar replay (src/replay.js) ----------------
   Click "Bar replay", then click a candle on either chart: the session is shown as if it were happening up to that candle.
   Play / pause, step one LTF candle back or forward, change the speed, or drag the slider. Both charts, every indicator, the HTF
   patterns, the C1-C6 arrows and the strategy trades are rebuilt from ONLY the ticks up to the replay time (a trade that has not
   hit its stop or target yet shows as open). Exit returns to the whole session. */
const rpEl = {
  enter: document.getElementById('rp-enter'), box: document.getElementById('rp-controls'),
  back: document.getElementById('rp-back'), play: document.getElementById('rp-play'), fwd: document.getElementById('rp-fwd'),
  speed: document.getElementById('rp-speed'), win: document.getElementById('rp-window'), slider: document.getElementById('rp-slider'), label: document.getElementById('rp-label'),
  exit: document.getElementById('rp-exit'),
};
const RP_SPEEDS = [['1×', 1000], ['2×', 500], ['5×', 200], ['10×', 100], ['25×', 40]];
RP_SPEEDS.forEach(([name, ms], i) => {
  const o = document.createElement('option'); o.value = String(ms); o.textContent = name; if (i === 2) o.selected = true; rpEl.speed.appendChild(o);
});
rpEl.speed.value = String(RP_SPEEDS[2][1]);
const RP_WINDOWS = [60, 120, 240, 500];
RP_WINDOWS.forEach((n) => { const o = document.createElement('option'); o.value = String(n); o.textContent = n + ' bars'; rpEl.win.appendChild(o); });
rpEl.win.value = '120';

/** geometry of the session on screen: first / last tick, LTF candle length, number of LTF candles */
function rpGeom() {
  const f = getFullTicks(app.symbol, app.date);
  if (!f || !f.times.length) return null;
  const t0 = f.times[0], last = f.times[f.times.length - 1], tf = ltfPanel.tfSec;
  return { t0, last, tf, kMax: Math.max(1, Math.ceil((last - t0 + 1) / tf)) };
}
const rpTimeForK = (g, k) => Math.min(g.last, TR.closeTimeOfCandle(g.t0, g.tf, k));
const rpKNow = (g) => (app.replay.time >= g.last ? g.kMax : Math.max(1, Math.min(g.kMax, TR.candleCountAt(g.t0, g.tf, app.replay.time))));

function rpUpdateUi() {
  const r = app.replay;
  rpEl.enter.classList.toggle('on', !!r);
  rpEl.box.hidden = !r;
  if (!r) return;
  if (r.time == null) {
    rpEl.label.textContent = 'click a candle on either chart to start (Esc cancels)';
    rpEl.slider.disabled = true;
    return;
  }
  const g = rpGeom();
  if (!g) return;
  const k = rpKNow(g);
  rpEl.slider.disabled = false;
  rpEl.slider.max = String(g.kMax);
  rpEl.slider.value = String(k);
  rpEl.play.innerHTML = r.timer ? '&#9208;' : '&#9654;';
  rpEl.label.textContent = fmtTime.format(new Date(r.time * 1000)) + ' IST · candle ' + k + ' / ' + g.kMax + ' (' + TF_LABELS[g.tf] + ')';
}

/**
 * Frame the chart on the replay: a FIXED number of candles is in view (the LTF shows `bars`, the HTF the same stretch of time), so the
 * candles keep a readable width from the first step on. Until that many candles exist they start at the left edge and fill toward the
 * right; after that the view follows the newest candle, which sits near the right edge.
 */
function rpFollow(p) {
  const n = p.candles.length;
  if (!n) return;
  const bars = Number(rpEl.win.value) || 120;
  const ratio = Math.max(1, Math.round(p.tfSec / ltfPanel.tfSec));          // 1 for the LTF, 5 for the HTF
  const w = p === ltfPanel ? bars : Math.max(24, Math.round(bars / ratio));
  const from = Math.max(-1, n - w), to = Math.max(n - 1, w - 2) + 2;
  p.chart.timeScale().setVisibleLogicalRange({ from, to });
}

/** redraw both panels and everything derived from them for the current replay time */
function rpShow(fit) {
  for (const p of panels) p.render(fit);
  applyConfirmation();
  for (const p of panels) rpFollow(p);
  rpUpdateUi();
}
function rpSetK(k, fit) {
  const g = rpGeom();
  if (!g || !app.replay) return;
  app.replay.time = rpTimeForK(g, Math.max(1, Math.min(g.kMax, k)));
  rpShow(fit);
}
function rpStartFromClick(clickedTime) {
  const g = rpGeom();
  if (!g || !app.replay) return;
  app.replay.armed = false;
  rpSetK(Math.floor((clickedTime - g.t0) / g.tf) + 1, false);
}
function rpPause() {
  if (app.replay && app.replay.timer) { clearInterval(app.replay.timer); app.replay.timer = null; }
  rpUpdateUi();
}
function rpStep(d) {
  const g = rpGeom();
  if (!g || !app.replay || app.replay.time == null) return;
  const k = rpKNow(g) + d;
  if (k > g.kMax) { rpPause(); return; }                                             // reached the end of the session
  rpSetK(k, false);
}
function rpPlay() {
  const r = app.replay;
  if (!r || r.time == null) return;
  if (r.timer) { rpPause(); return; }
  const g = rpGeom();
  if (g && rpKNow(g) >= g.kMax) rpSetK(1, false);                                      // at the end: play again from the start
  r.timer = setInterval(() => rpStep(1), Number(rpEl.speed.value));
  rpUpdateUi();
}
function rpEnter() {
  if (app.replay) { rpExit(); return; }
  if (!rpGeom()) return;
  app.replay = { time: null, armed: true, timer: null };
  rpUpdateUi();
}
/** leave replay without redrawing (used when the instrument / date changes and a redraw follows anyway) */
function rpReset() {
  if (app.replay && app.replay.timer) clearInterval(app.replay.timer);
  app.replay = null;
  rpUpdateUi();
}
function rpExit() {
  const wasShowing = !!(app.replay && app.replay.time != null);
  rpReset();
  if (wasShowing) refresh();                                                         // whole session again, fitted
}
rpEl.enter.addEventListener('click', rpEnter);
rpEl.exit.addEventListener('click', rpExit);
rpEl.play.addEventListener('click', rpPlay);
rpEl.back.addEventListener('click', () => { rpPause(); rpStep(-1); });
rpEl.fwd.addEventListener('click', () => { rpPause(); rpStep(1); });
rpEl.speed.addEventListener('change', () => { if (app.replay && app.replay.timer) { rpPause(); rpPlay(); } });
rpEl.win.addEventListener('change', () => { if (app.replay && app.replay.time != null) for (const p of panels) rpFollow(p); });
rpEl.slider.addEventListener('input', () => { rpPause(); rpSetK(Number(rpEl.slider.value), false); });
document.addEventListener('keydown', (e) => {
  if (!app.replay) return;
  const tag = (e.target && e.target.tagName) || '';
  if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
  if (e.key === 'Escape') { rpExit(); }
  else if (app.replay.time == null) return;
  else if (e.key === ' ') { e.preventDefault(); rpPlay(); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); rpPause(); rpStep(1); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); rpPause(); rpStep(-1); }
});
window.__replayApi = { enter: rpEnter, startFromClick: rpStartFromClick, step: rpStep, setK: rpSetK, exit: rpExit, play: rpPlay, pause: rpPause, state: () => app.replay };   // used by the tests / diagnostics

function refresh() {
  for (const p of panels) p.render(true);
  renderMeta();
  updateLockChip();
  applyConfirmation();
  document.title = app.symbol + ' ' + app.date + ' — Tick Charts';
}

instrumentEl.addEventListener('change', () => {
  rpReset();
  app.symbol = instrumentEl.value;
  fillDates();
  refresh();
});
dateEl.addEventListener('change', () => {
  rpReset();
  app.date = dateEl.value;
  refresh();
});

fillInstruments();
fillDates();
fillStrategies();
refresh();
</script>
</body>
</html>

/* ---------- HTF pattern confirmation ---------- */

const confirmCache = new Map();

/** Cache key carries the filter mode+values so config changes can never serve stale states. */
function confirmFilterKey(cfg) {
  if (!cfg) return 'off';
  const part = (c) => !c || c.mode === 'off' ? 'off'
    : c.mode === 'error' ? 'error|' + c.problems.join(';')
    : 'active|' + JSON.stringify(c.filter);
  return part(cfg) + '#' + part(cfg.rsi) + '#' + part(cfg.oi);   // slope + rsi + oi sections all in the key
}

/** §6.9 — evaluated once per (symbol, date, htfSec, filter); interactions never recompute. */
function getStates(htfCandles, htfSec, sessionEndTick, filterBase) {
  const key = app.symbol + '|' + app.date + '|' + htfSec + '|' + confirmFilterKey(filterBase);
  if (confirmCache.has(key)) return confirmCache.get(key);
  // the OI-change gate needs this session's CE / PE open-interest change per HTF candle (src/oi-flow.js)
  let filterCfg = filterBase;
  if (filterBase && filterBase.oi && filterBase.oi.mode === 'active') {
    const t = getTicks(app.symbol, app.date);
    const perCandle = TF_.changePerCandle(t && t.meta.flow, htfCandles, htfSec).map((a) => (a ? { dce: a.dce, dpe: a.dpe } : null));
    filterCfg = Object.assign({}, filterBase, { oi: Object.assign({}, filterBase.oi, { perCandle }) });
  }
  const v = TC.evaluate(htfCandles, { htfSec, sessionEndTick, filter: filterCfg });
  confirmCache.set(key, v);
  return v;
}

/**
 * Single source of truth (§6.10): one evaluate() result feeds the badge, the HTF
 * markers, the −2 outline, the LTF bands and both readouts, so they cannot disagree.
 * Writes no series data — only markers, a primitive payload and DOM positions.
 */
function applyConfirmation() {
  const badge = document.getElementById('conf-badge');
  const stratBadge = document.getElementById('strategy-badge');
  stratBadge.className = 'conf-badge strat-badge';
  stratBadge.textContent = '';
  for (const p of panels) p.clearConfirm();

  if (!app.confirmOn) {
    badge.className = 'conf-badge';
    badge.textContent = '';
    return;
  }

  const ticks = getTicks(app.symbol, app.date);
  if (!ticks || !htfPanel.candles.length || !ltfPanel.candles.length) {
    badge.className = 'conf-badge';
    badge.textContent = '';
    return;
  }

  const sessionEndTick = ticks.meta.sessionEnd;
  const htfSec = htfPanel.tfSec, ltfSec = ltfPanel.tfSec;
  const states = getStates(htfPanel.candles, htfSec, sessionEndTick, SLOPE_FILTER);
  const ltfBands = TC.mapToLtf(ltfPanel.candles, states, { htfSec, ltfSec });

  htfPanel.states = states;
  ltfPanel.ltfBands = ltfBands;

  // HTF markers — one setMarkers call; No Not-Matched markers (§11 decision 2)
  const markers = [];
  Array.from(states.values())
    .sort((a, b) => a.closeTime - b.closeTime)
    .forEach((s) => {
      if (s.state === TC.STATE.MATCHED) {
        markers.push({
          time: s.candleTime,
          position: s.pattern === 'A' ? 'aboveBar' : 'belowBar',
          color: s.pattern === 'A' ? '#2962ff' : '#ff9800',
          shape: s.pattern === 'A' ? 'arrowUp' : 'arrowDown',
          text: 'Pattern ' + s.pattern,
        });
      } else if (s.state === TC.STATE.UNAVAILABLE) {
        markers.push({ time: s.candleTime, position: 'aboveBar', color: '#6b7280', shape: 'circle', text: '–' });
      }
    });
  htfPanel.series.setMarkers(markers);

  // −2 outline: the candle being judged by the latest evaluable state
  const last = TC.latest(states, sessionEndTick);
  htfPanel.lastState = last;
  htfPanel.outlineTime = null;
  if (last && last.state !== TC.STATE.UNAVAILABLE && last.c2Time != null) {
    const c2 = htfPanel.seriesData.get(last.c2Time);
    if (c2) {
      htfPanel.outlineTime = c2.time;
      htfPanel.outlineHigh = c2.high;
      htfPanel.outlineLow = c2.low;
    }
  }
  htfPanel.scheduleOutline();

  // LTF bands — only Matched windows paint (Not Matched / Unavailable stay unmarked)
  const bandWindows = [];
  states.forEach((s) => {
    if (s.state === TC.STATE.MATCHED) {
      bandWindows.push({ from: s.closeTime - htfSec, to: s.closeTime, pattern: s.pattern });
    }
  });
  ltfPanel.setBandWindows(bandWindows);

  // LTF conditions C1 -> C5 come from ONE shared chain (TL.runChain), so the page, the strategy simulation and the
  // back-test runner (scripts/run-backtest.js) can never disagree about which candles are signals.
  const ltfMarkers = [];                                    // everything drawn on the LTF chart: C1..C5 arrows + the selected strategy's trades
  const chain = (app.ltfOn && LTF_COND1.mode === 'active')
    ? TL.runChain(ltfPanel.candles, bandWindows,
        { c1: LTF_COND1, c2: LTF_COND2, c3: LTF_COND3, c4: LTF_COND4, c5: LTF_COND5, c6: LTF_COND6 }, TC.rsiArray)
    : null;
  if (chain) {
    const keep = (map, marks) => marks.forEach((m) => {
      if (!map.has(m.windowCloseTime)) map.set(m.windowCloseTime, []);
      map.get(m.windowCloseTime).push(m);
    });
    keep(ltfPanel.cond1, chain.c1);
    keep(ltfPanel.cond2, chain.c2);
    keep(ltfPanel.cond3, chain.c3);
    keep(ltfPanel.cond4, chain.c4);
    keep(ltfPanel.cond5, chain.c5);

    const mk = (m, tag, colorA, colorB) => ({
      time: m.time,
      position: m.pattern === 'A' ? 'belowBar' : 'aboveBar',
      color: m.pattern === 'A' ? colorA : colorB,
      shape: m.pattern === 'A' ? 'arrowUp' : 'arrowDown',
      text: tag + ' ' + m.pattern,
    });
    // C1 AND C2 (AND C3 AND C4 AND C5) on one candle = ONE combined arrow; weaker candles keep the arrow they earned
    const markers = chain.marks.map((m) =>
      m.kind === 'C1+C2+C3+C4+C5+C6' ? mk(m, 'C1+C2+C3+C4+C5+C6', '#ff4081', '#ff4081')
      : m.kind === 'C1+C2+C3+C4+C5' ? mk(m, 'C1+C2+C3+C4+C5', LTF_COND6.mode === 'active' ? '#9575cd' : '#ff4081', LTF_COND6.mode === 'active' ? '#9575cd' : '#ff4081')   // with C6 on, a C5-only arrow failed the risk range
      : m.kind === 'C1+C2+C3+C4' ? mk(m, 'C1+C2+C3+C4', '#00c853', '#ff5252')
      : m.kind === 'C1+C2+C3' ? mk(m, 'C1+C2+C3', '#ffc107', '#b388ff')
      : m.kind === 'C1+C2' ? mk(m, 'C1+C2', '#00bcd4', '#e040fb')
      : mk(m, 'C1', '#2962ff', '#ff9800'));
    ltfMarkers.push(...markers);
  }

  // Strategy (docs/strategy.md): the selected strategy's signals -> long (A) / short (B), entry next candle open,
  // stop / target from the E candle distance. Signals come from the registry (src/strategies.js).
  const SEL = app.strategy ? REGISTRY.byName[app.strategy] : null;
  const needs = SEL && SEL.implemented ? TS.SIGNALS[SEL.signals].needs : null;     // 'chain' (HTF zone + C1..C5) or 'candles' (LTF candles only)
  const haveInputs = needs === 'candles' || (needs === 'chain' && chain && LTF_COND5.mode === 'active');
  if (SEL && SEL.runnable && haveInputs) {
    const STRATEGY = SEL.trade;
    const signals = TS.signalsFor(SEL, { chain, candles: ltfPanel.candles, rsiArray: TC.rsiArray });
    const sim = TT.simulateTrades(signals, ticks, ltfPanel.candles, ltfSec, STRATEGY.cfg);
    const sum = TT.summarize(sim.trades);
    const cs = ltfPanel.candles;
    const snap = (t) => {                       // the candle a time falls in (markers sit on candle times)
      let lo = 0, hi = cs.length - 1;
      while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (cs[mid].time <= t) lo = mid; else hi = mid - 1; }
      return cs[lo].time;
    };
    const d = ltfPanel.decimals;
    const sg = (v) => (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(2);
    for (const t of sim.trades) {
      ltfMarkers.push({ time: snap(t.entryTime), position: 'inBar', shape: 'square', color: '#ffffff',
                     text: (t.side === 'LONG' ? 'LONG @' : 'SHORT @') + t.entryPrice.toFixed(d) });
      ltfMarkers.push({ time: snap(t.exitTime), position: 'inBar', shape: 'circle', color: t.pnl > 0 ? '#00e676' : t.pnl < 0 ? '#ff1744' : '#9e9e9e',
                     text: (t.exitReason === 'TARGET' ? 'TP ' : t.exitReason === 'STOP' ? 'SL ' : t.exitReason === 'HARD' ? 'HARD ' : 'EOD ') + sg(t.pnl) });
    }
    const pf = (v) => (v === null ? '—' : v === Infinity ? '∞' : v.toFixed(2));
    // browser console (F12 / Cmd+Option+J): the same numbers as the badge plus a trade-by-trade table
    if (sum.trades) {
      const hm = (t) => fmtTime.format(new Date(t * 1000));
      console.groupCollapsed('[' + SEL.name + '] ' + app.symbol + ' ' + app.date + ' ' + TF_LABELS[ltfSec] + ' — ' + sum.trades + ' trades, ' +
        sum.wins + ' wins / ' + sum.losses + ' losses, hit ' + (sum.winRate * 100).toFixed(1) + '%, P&L ' + sg(sum.totalPnl) + ' pts');
      console.table(sim.trades.map((t) => ({
        side: t.side, signal: hm(t.signalTime), entry: hm(t.entryTime), 'entry px': +t.entryPrice.toFixed(d),
        risk: +t.risk.toFixed(d), stop: +t.stop.toFixed(d), target: +t.target.toFixed(d),
        exit: hm(t.exitTime), 'exit px': +t.exitPrice.toFixed(d), why: t.exitReason, 'P&L': +t.pnl.toFixed(2), R: +t.r.toFixed(2),
      })));
      console.log('wins ' + sum.wins + ' · losses ' + sum.losses + ' · hit ratio ' + (sum.winRate * 100).toFixed(1) + '% · total P&L ' + sg(sum.totalPnl) +
        ' · avg/trade ' + sg(sum.avgPnl) + ' · profit factor ' + pf(sum.profitFactor) + ' · max drawdown ' + sum.maxDrawdown.toFixed(2) +
        ' · longest losing streak ' + sum.maxConsecLosses + ' · skipped ' + sim.skipped.length);
      console.groupEnd();
    } else {
      console.info('[' + SEL.name + '] ' + app.symbol + ' ' + app.date + ' ' + TF_LABELS[ltfSec] + ' — no trades (' + sim.skipped.length + ' skipped)');
    }
    if (!sum.trades) {
      stratBadge.className = 'conf-badge strat-badge on';
      stratBadge.textContent = SEL.title + ': no trades';
      stratBadge.title = 'No full ' + (chain.fullKind || 'C1+C2+C3+C4+C5') + ' signal on this session / timeframe (' + sim.skipped.length + ' skipped)';
    } else {
      stratBadge.className = 'conf-badge strat-badge on ' + (sum.totalPnl > 0 ? 'pos' : sum.totalPnl < 0 ? 'neg' : '');
      stratBadge.textContent = SEL.title + ': ' + sum.trades + (sum.trades === 1 ? ' trade' : ' trades') + ' · hit ' +
        Math.round(sum.winRate * 100) + '% · P&L ' + sg(sum.totalPnl) + ' pts';
      stratBadge.title =
        SEL.title + ' back-test of this session on this timeframe (points, size 1, no costs unless set)\n' +
        'Trades ' + sum.trades + ' (long ' + sum.long.trades + ', short ' + sum.short.trades + ')   skipped ' + sim.skipped.length + '\n' +
        'Wins ' + sum.wins + '   Losses ' + sum.losses + '   Hit ratio ' + (sum.winRate * 100).toFixed(1) + '%\n' +
        'Exits: target ' + sum.targetHits + ', stop ' + sum.stopHits + ', hard exit ' + sum.hardExits + ', end of session ' + sum.eodExits + '\n' +
        'Total P&L ' + sg(sum.totalPnl) + '   Avg/trade ' + sg(sum.avgPnl) + '   Avg R ' + sg(sum.avgR) + '\n' +
        'Avg win ' + (sum.avgWin === null ? '—' : sg(sum.avgWin)) + '   Avg loss ' + (sum.avgLoss === null ? '—' : sg(sum.avgLoss)) + '\n' +
        'Profit factor ' + pf(sum.profitFactor) + '   Max drawdown ' + sum.maxDrawdown.toFixed(2) + '   Longest losing streak ' + sum.maxConsecLosses;
    }
  } else if (REGISTRY.mode === 'error') {
    stratBadge.className = 'conf-badge strat-badge on';
    stratBadge.textContent = 'Strategy: Config error';
    stratBadge.title = REGISTRY.problems.join('; ');
  } else if (!SEL) {
    stratBadge.className = 'conf-badge strat-badge';
    stratBadge.textContent = '';
    stratBadge.title = 'No strategy is switched on in config/strategies.json';
  }
  ltfMarkers.sort((x, y) => x.time - y.time);
  ltfPanel.series.setMarkers(ltfMarkers);
  // the newest LTF candle may sit past the last window (partial tail bar), so fall back
  // to the most recent candle that actually has a window
  ltfPanel.lastLtfState = null;
  ltfBands.forEach((s) => {
    if (!ltfPanel.lastLtfState || s.closeTime > ltfPanel.lastLtfState.closeTime) ltfPanel.lastLtfState = s;
  });

  // badge — latest eligible completed candle only (§6.10)
  if (last) {
    const t = fmtTime.format(new Date(last.closeTime * 1000));
    if (CONFIG_ERROR) {
      badge.className = 'conf-badge on';
      badge.textContent = 'HTF: Config error';
    } else if (last.state === TC.STATE.MATCHED) {
      badge.className = 'conf-badge on ' + last.pattern.toLowerCase();
      badge.textContent = 'HTF: Matched ' + last.pattern + ' · ' + t;
    } else if (last.state === TC.STATE.NOT_MATCHED) {
      badge.className = 'conf-badge on';
      badge.textContent = 'HTF: Not Matched · ' + t;
    } else {
      badge.className = 'conf-badge on';
      badge.textContent = 'HTF: Unavailable · ' + t;
    }
  }

  // readouts at rest (the crosshair subscription takes over on hover)
  htfPanel.drawConfirmLegend(last, true);
  ltfPanel.drawConfirmLegend(ltfPanel.lastLtfState, false);
}

/* Signal timeframe moves the confirmation timeframe with it ... */
ltfPanel.tfEl.addEventListener('change', () => {
  const htf = HTF_OF[ltfPanel.tfSec];
  htfPanel.tfEl.value = String(htf);
  htfPanel.tfSec = htf;
  htfPanel.render(true);
  updateLockChip();
  applyConfirmation();
});

/* ... and vice versa, so the pair can never drift apart. */
htfPanel.tfEl.addEventListener('change', () => {
  const ltf = LTF_OF[htfPanel.tfSec];
  ltfPanel.tfEl.value = String(ltf);
  ltfPanel.tfSec = ltf;
  ltfPanel.render(true);
  updateLockChip();
  applyConfirmation();
});

/* HTF Confirmation ON/OFF — clears visuals only; never touches series data. */
document.getElementById('confirm-toggle').addEventListener('change', (e) => {
  app.confirmOn = e.target.checked;
  applyConfirmation();
});

/* LTF Conditions ON/OFF — clears only the condition arrows/readout chip; bands stay. */
document.getElementById('ltf-toggle').addEventListener('change', (e) => {
  app.ltfOn = e.target.checked;
  applyConfirmation();
});

/* Strategy selector — only changes which strategy's trades are simulated and drawn; the C1–C5 arrows stay. */
strategyEl.addEventListener('change', () => {
  app.strategy = strategyEl.value;
  applyConfirmation();
});

function refresh() {
  for (const p of panels) p.render(true);
  renderMeta();
  updateLockChip();
  applyConfirmation();
  document.title = app.symbol + ' ' + app.date + ' — Tick Charts';
}

instrumentEl.addEventListener('change', () => {
  app.symbol = instrumentEl.value;
  fillDates();
  refresh();
});
dateEl.addEventListener('change', () => {
  app.date = dateEl.value;
  refresh();
});

fillInstruments();
fillDates();
fillStrategies();
refresh();
</script>
</body>
</html>
